name: BTO Cloudflare Credential Probe

on:
  push:
    branches: [bto-prodigi-final-fix]
    paths:
      - ".github/workflows/bto-cloudflare-credential-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check persistent credentials without interactive login
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "TOKEN_PRESENT=false"
            exit 2
          fi
          echo "TOKEN_PRESENT=true"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ACCOUNT_ID_PRESENT=false"
          else
            echo "ACCOUNT_ID_PRESENT=true"
          fi
          npx wrangler whoami
