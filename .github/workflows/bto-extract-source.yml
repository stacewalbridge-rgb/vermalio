name: BTO Extract Source

on:
  push:
    branches: [bto-source-inspect]
    paths:
      - ".github/workflows/bto-extract-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract production source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bto-src && mkdir -p /tmp/bto-src
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 | base64 -d > /tmp/bto.tar.xz
          tar -xJf /tmp/bto.tar.xz -C /tmp/bto-src
          root=$(find /tmp/bto-src -type f -path '*/src/index.js' -printf '%h\n' | head -1 | sed 's#/src$##')
          test -n "$root"
          mkdir -p _inspect
          cp "$root/src/index.js" _inspect/bto-index.js
          cp "$root/public/app.js" _inspect/bto-app.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _inspect/bto-index.js _inspect/bto-app.js
          git commit -m "Extract Built To Offend source for inspection"
          git push origin HEAD:bto-source-inspect
