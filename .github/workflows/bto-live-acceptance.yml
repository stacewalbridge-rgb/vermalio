name: Built To Offend live acceptance

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - ".github/workflows/bto-live-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Full non-charging live acceptance
        shell: bash
        run: |
          set -euo pipefail
          base=https://builttooffend.com

          echo '== domains + health =='
          for host in builttooffend.com www.builttooffend.com builttooffend.co.uk www.builttooffend.co.uk; do
            code=$(curl -sS --max-time 20 -o /tmp/h.json -w '%{http_code}' "https://$host/api/health")
            test "$code" = 200
            HOST="$host" node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/h.json","utf8")); if(j.ok!==true||j.hostname!==process.env.HOST) process.exit(1)'
          done

          echo '== config =='
          config=$(curl -fsS --max-time 20 "$base/api/config")
          echo "$config"
          CONFIG="$config" node - <<'NODE'
          const c=JSON.parse(process.env.CONFIG||'{}');
          if(c.cardPricePence!==499) throw new Error('standard card price mismatch');
          if(c.photoAddOnPence!==100) throw new Error('photo add-on mismatch');
          if(c.ukShippingPence!==199) throw new Error('shipping mismatch');
          if(c.currency!=='gbp') throw new Error('currency mismatch');
          NODE

          echo '== AI generation =='
          generated=$(curl -fsS --max-time 45 -X POST -H 'content-type: application/json' \
            --data '{"recipient":"Acceptance Test","occasion":"Birthday","relationship":"Friend","tone":"playful","ammo":"always late","quote":"","avoid":"","brutality":4,"art":"monster"}' \
            "$base/api/generate")
          GENERATED="$generated" node - <<'NODE'
          const j=JSON.parse(process.env.GENERATED||'{}');
          if(!Array.isArray(j.versions)||j.versions.length<3) throw new Error('AI generation did not return 3 versions');
          for(const v of j.versions.slice(0,3)){ if(!v.front||!v.inside) throw new Error('generated card incomplete'); }
          NODE

          echo '== order + secure asset upload =='
          order=$(curl -fsS --max-time 30 -X POST -H 'content-type: application/json' \
            --data '{"recipient":"BTO-ACCEPTANCE","occasion":"Birthday","brutality":4,"label":"ACCEPTANCE","front":"BTO ACCEPTANCE TEST","inside":"Automated draft. Never fulfil this order.","art":"monster"}' \
            "$base/api/orders")
          order_id=$(ORDER="$order" node -e 'const j=JSON.parse(process.env.ORDER); process.stdout.write(j.orderId||"")')
          token=$(ORDER="$order" node -e 'const j=JSON.parse(process.env.ORDER); process.stdout.write(j.uploadToken||"")')
          test -n "$order_id"; test -n "$token"
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z3ioAAAAASUVORK5CYII=' | base64 -d >/tmp/a.png

          bad=$(curl -sS --max-time 20 -o /tmp/bad.json -w '%{http_code}' -X PUT \
            -H 'content-type: image/png' -H 'x-order-token: definitely-wrong-token' --data-binary @/tmp/a.png \
            "$base/api/order-asset?order_id=$order_id&kind=outside")
          test "$bad" = 403

          for kind in outside inside; do
            code=$(curl -sS --max-time 30 -o /tmp/upload.json -w '%{http_code}' -X PUT \
              -H 'content-type: image/png' -H "x-order-token: $token" --data-binary @/tmp/a.png \
              "$base/api/order-asset?order_id=$order_id&kind=$kind")
            test "$code" = 200
            KIND="$kind" node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/upload.json","utf8")); if(j.ok!==true||j.kind!==process.env.KIND) process.exit(1)'
          done

          echo '== checkout handoff =='
          checkout_code=$(curl -sS --max-time 30 -o /tmp/checkout.json -w '%{http_code}' -X POST -H 'content-type: application/json' \
            --data "{\"orderId\":\"$order_id\",\"uploadToken\":\"$token\"}" "$base/api/checkout")
          READY=$(CONFIG="$config" node -e 'const c=JSON.parse(process.env.CONFIG); process.stdout.write(c.checkoutReady?"1":"0")')
          if [ "$READY" = 1 ]; then
            test "$checkout_code" = 200
            ORDER_ID="$order_id" node - <<'NODE'
            const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/checkout.json','utf8'));
            const u=new URL(j.checkoutUrl);
            if(u.hostname!=='buy.stripe.com') throw new Error('checkout is not Stripe');
            if(u.searchParams.get('client_reference_id')!==process.env.ORDER_ID) throw new Error('checkout reference mismatch');
            NODE
          else
            test "$checkout_code" = 503
          fi

          echo '== Vermalio Prodigi webhook receiver =='
          code=$(curl -sS --max-time 20 -o /tmp/prodigi-health.json -w '%{http_code}' https://vermalio.stace-walbridge.workers.dev/api/prodigi/webhook/health)
          test "$code" = 200
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/prodigi-health.json","utf8")); if(j.ok!==true) process.exit(1)'

          echo 'ACCEPTANCE PASS'

# Live acceptance rerun after permanent Cloudflare CI credential repair.
