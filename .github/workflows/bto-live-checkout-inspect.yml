name: BTO Live Checkout Inspect

on:
  push:
    branches: [bto-prodigi-final-fix]
    paths:
      - ".github/workflows/bto-live-checkout-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live customer checkout code
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://builttooffend.com/app.js?cb=live-inspect' -o /tmp/app.js
          echo '=== LIVE API CALLS ==='
          grep -nE "apiJson\(|fetch\(|/api/|checkout|uploadAsset|createOrder" /tmp/app.js | head -220
