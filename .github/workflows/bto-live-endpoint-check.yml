name: BTO Live Endpoint Check

on:
  push:
    branches: [bto-prodigi-final-fix]
    paths:
      - ".github/workflows/bto-live-endpoint-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live fulfilment state for recent paid orders
        shell: bash
        run: |
          set -euo pipefail
          echo '=== LATEST PAID SESSION ==='
          curl -sS --max-time 30 'https://builttooffend.com/api/order-status?session_id=cs_live_b1rgDhu7xOdgT9iua3ByL6javML7mWpgc1Im5DFWGkGVGoIYheCiYgmAHb' || true
          echo
          echo '=== PREVIOUS PAID SESSION ==='
          curl -sS --max-time 30 'https://builttooffend.com/api/order-status?session_id=cs_live_b1zrLDcYL5SfGlCc05WHqarTJtYV7b8U70LdwD9zKsaQ2q6Hjui4PKlslS' || true
          echo
          echo '=== PRODIGI PROVIDER ==='
          curl -sS --max-time 30 'https://vermalio.stace-walbridge.workers.dev/api/prodigi/provider-stats' || true
          echo
          echo '=== BRIDGE HEALTH ==='
          curl -sS --max-time 30 'https://vermalio.stace-walbridge.workers.dev/api/internal/bto/prodigi/health' || true
          echo
