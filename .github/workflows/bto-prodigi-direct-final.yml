name: BTO Direct Prodigi Final

on:
  push:
    branches: [bto-prodigi-final-fix]
    paths:
      - ".github/workflows/bto-prodigi-direct-final.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
      BTO_DIR: ${{ github.workspace }}/.deploy/built-to-offend-production
      PRODIGI_SKU: GLOBAL-GRE-MOH-7X5-DIR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Receive Prodigi key securely
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/bto-prodigi-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/bto-prodigi-private.pem -pubout -out /tmp/bto-prodigi-public.pem >/dev/null 2>&1
          pub=$(base64 -w0 /tmp/bto-prodigi-public.pem)
          cat >/tmp/handoff-body.txt <<EOF
          BTO_PRODIGI_PUBLIC_KEY_B64:$pub

          Post only RSA-OAEP/SHA-256 encrypted ciphertext beginning PRODIGI_SECRET_CIPHERTEXT_B64:. Never post plaintext.
          EOF
          issue_url=$(gh issue create --title "Built To Offend direct Prodigi encrypted handoff — run ${{ github.run_number }}" --body-file /tmp/handoff-body.txt)
          issue_number=${issue_url##*/}
          echo "handoff_issue=$issue_number" >> "$GITHUB_OUTPUT"
          cipher=""
          for attempt in $(seq 1 180); do
            cipher=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" --jq '.[].body' 2>/dev/null | sed -n 's/^PRODIGI_SECRET_CIPHERTEXT_B64://p' | tr -d '\r\n\t ' | tail -1 || true)
            if [ -n "$cipher" ]; then break; fi
            sleep 2
          done
          test -n "$cipher"
          printf '%s' "$cipher" | base64 -d >/tmp/prodigi-key.enc
          openssl pkeyutl -decrypt -inkey /tmp/bto-prodigi-private.pem -in /tmp/prodigi-key.enc -out /tmp/prodigi-key.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          PRODIGI_KEY=$(cat /tmp/prodigi-key.txt)
          test ${#PRODIGI_KEY} -ge 20
          echo "::add-mask::$PRODIGI_KEY"
          chmod 600 /tmp/prodigi-key.txt
          rm -f /tmp/prodigi-key.enc /tmp/bto-prodigi-private.pem /tmp/bto-prodigi-public.pem /tmp/handoff-body.txt

      - name: Authenticate to Cloudflare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          export NO_COLOR=1 FORCE_COLOR=0
          rm -f /tmp/cloudflare-device-login.log
          set +e
          (npx wrangler login --device --browser=false >/tmp/cloudflare-device-login.log 2>&1) &
          login_pid=$!
          set -e
          for poll in $(seq 1 45); do
            if grep -q 'enter the code' /tmp/cloudflare-device-login.log 2>/dev/null; then break; fi
            sleep 1
          done
          grep -q 'enter the code' /tmp/cloudflare-device-login.log
          printf '\nDeployment run: %s\n\n' "$RUN_URL" >>/tmp/cloudflare-device-login.log
          gh issue create --title "Cloudflare approval required — BTO DIRECT PRODIGI FINAL — run ${{ github.run_number }}" --body-file /tmp/cloudflare-device-login.log || true
          set +e
          wait "$login_pid"
          rc=$?
          set -e
          cat /tmp/cloudflare-device-login.log || true
          test "$rc" = 0
          npx wrangler whoami

      - name: Build and validate direct Prodigi production
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 | base64 -d > .deploy/built-to-offend.tar.xz
          tar -xJf .deploy/built-to-offend.tar.xz -C .deploy
          cp built-to-offend/deploy/0002_secure_tokens.sql "$BTO_DIR/migrations/0002_secure_tokens.sql"
          cd "$BTO_DIR"
          patch -p0 --forward < "$GITHUB_WORKSPACE/built-to-offend/deploy/bto-source.patch"
          node "$GITHUB_WORKSPACE/.github/bto-seo-build.js"
          npm install --no-audit --no-fund
          node --check src/index.js
          node --check public/app.js

          npx wrangler kv namespace list >/tmp/bto-kv-list.json
          npx wrangler d1 list --json >/tmp/bto-d1-list.json
          node <<'NODE'
          const fs=require('fs');
          const kv=JSON.parse(fs.readFileSync('/tmp/bto-kv-list.json','utf8'));
          const hit=kv.find(x=>x.title==='BTO_PRIVATE_ASSETS'||x.title==='built-to-offend-private-assets'||String(x.title||'').endsWith('-BTO_PRIVATE_ASSETS'));
          if(!hit?.id) throw new Error('BTO private KV missing');
          const d1=JSON.parse(fs.readFileSync('/tmp/bto-d1-list.json','utf8'));
          const db=d1.find(x=>x.name==='built-to-offend-db');
          const dbid=db?.uuid||db?.id||db?.database_id;
          if(!dbid) throw new Error('BTO D1 missing');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          delete cfg.r2_buckets;
          cfg.kv_namespaces=[{binding:'ASSET_BUCKET',id:hit.id}];
          cfg.d1_databases=[{binding:'DB',database_name:'built-to-offend-db',database_id:dbid}];
          cfg.vars={...(cfg.vars||{}),PUBLIC_BASE_URL:'https://builttooffend.com',CARD_PRICE_PENCE:'499',UK_SHIPPING_PENCE:'199',PHOTO_ADDON_PENCE:'100',STRIPE_STANDARD_PAYMENT_LINK:'https://buy.stripe.com/14A4gA3IEfWa3O7a5J8so02',STRIPE_PHOTO_PAYMENT_LINK:'https://buy.stripe.com/00w8wQ92YcJY4Sb1zd8so03',PRINT_PROVIDER:'prodigi',PRODIGI_ENV:'live',PRODIGI_SKU:'GLOBAL-GRE-MOH-7X5-DIR',PRODIGI_SHIPPING_METHOD:'Budget'};
          delete cfg.vars.PRODIGI_PROXY_URL;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE

          PRODIGI_KEY=$(cat /tmp/prodigi-key.txt)
          echo "::add-mask::$PRODIGI_KEY"
          code=$(curl -sS --max-time 30 -o /tmp/prodigi-product.json -w '%{http_code}' -H "X-API-Key: $PRODIGI_KEY" "https://api.prodigi.com/v4.0/products/$PRODIGI_SKU")
          test "$code" = 200
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/prodigi-product.json','utf8'));
          if(String(j?.outcome||'').toLowerCase()!=='ok') throw new Error('Prodigi live key/SKU validation failed');
          const names=[]; const seen=new Set();
          const add=x=>{x=String(x||'').trim();if(x&&!seen.has(x)){seen.add(x);names.push(x)}};
          const walk=v=>{if(!v||typeof v!=='object')return;if(v.printAreas&&typeof v.printAreas==='object'&&!Array.isArray(v.printAreas))Object.keys(v.printAreas).forEach(add);if(v.printAreaSizes&&typeof v.printAreaSizes==='object'&&!Array.isArray(v.printAreaSizes))Object.keys(v.printAreaSizes).forEach(add);if(typeof v.printArea==='string')add(v.printArea);if(Array.isArray(v))v.forEach(walk);else Object.values(v).forEach(walk)};
          walk(j);
          const outside=names.find(x=>/front|cover|outside|default/i.test(x))||names[0];
          const inside=names.find(x=>/inside|inner|interior/i.test(x));
          if(!outside||!inside||outside===inside) throw new Error(`Prodigi card SKU does not expose outside+inside print areas: ${names.join(', ')}`);
          console.log(`Validated Prodigi live SKU with print areas: ${outside}, ${inside}`);
          NODE
          rm -f /tmp/prodigi-product.json

          printf '%s' "$PRODIGI_KEY" | npx wrangler secret put PRODIGI_API_KEY --config wrangler.jsonc >/tmp/bto-secret-put.log 2>&1
          unset PRODIGI_KEY
          rm -f /tmp/prodigi-key.txt /tmp/bto-secret-put.log
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
          npx wrangler deploy --dry-run --config wrangler.jsonc
          npx wrangler deploy --config wrangler.jsonc

      - name: Verify live checkout
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            config=$(curl -fsS --max-time 20 "https://builttooffend.com/api/config?cb=$(date +%s%N)" || true)
            if CONFIG_JSON="$config" node -e 'const c=JSON.parse(process.env.CONFIG_JSON||"{}"); process.exit(c.checkoutReady===true&&c.printer==="prodigi"?0:1)' 2>/dev/null; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo "$config"
          curl -fsS "https://builttooffend.com/api/health?cb=$(date +%s%N)" | grep -q '"ok":true'
          echo 'READY: Built To Offend -> Stripe -> direct Prodigi automatic print and dispatch.'
