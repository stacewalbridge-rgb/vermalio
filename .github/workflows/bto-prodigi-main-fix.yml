name: BTO Prodigi Main Fix

on:
  push:
    branches: [bto-prodigi-final-fix]
    paths:
      - ".github/workflows/bto-prodigi-main-fix.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
      BTO_DIR: ${{ github.workspace }}/.deploy/built-to-offend-production
      PRODIGI_PROXY_URL: https://vermalio.stace-walbridge.workers.dev/api/internal/bto/prodigi
      PRODIGI_SKU: GLOBAL-GRE-MOH-7X5-DIR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Cloudflare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          export NO_COLOR=1 FORCE_COLOR=0
          rm -f /tmp/cloudflare-device-login.log
          set +e
          (npx wrangler login --device --browser=false >/tmp/cloudflare-device-login.log 2>&1) &
          login_pid=$!
          set -e
          for poll in $(seq 1 45); do
            if grep -q 'enter the code' /tmp/cloudflare-device-login.log 2>/dev/null; then break; fi
            sleep 1
          done
          grep -q 'enter the code' /tmp/cloudflare-device-login.log
          printf '\nDeployment run: %s\n\n' "$RUN_URL" >>/tmp/cloudflare-device-login.log
          gh issue create --title "Cloudflare approval required — BTO PRODIGI MAIN FIX — run ${{ github.run_number }}" --body-file /tmp/cloudflare-device-login.log || true
          set +e
          wait "$login_pid"
          rc=$?
          set -e
          cat /tmp/cloudflare-device-login.log || true
          test "$rc" = 0
          npx wrangler whoami

      - name: Deploy Prodigi bridge on current Vermalio main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vermalio-live
          git fetch --depth=1 origin main:refs/remotes/origin/main
          git worktree add --detach /tmp/vermalio-live origin/main
          cd /tmp/vermalio-live
          npm install --no-audit --no-fund

          npx wrangler secret list --config wrangler.jsonc >/tmp/vermalio-secrets.txt
          grep -q 'PRODIGI_API_KEY' /tmp/vermalio-secrets.txt

          proxy_token=$(openssl rand -hex 32)
          proxy_hash=$(printf '%s' "$proxy_token" | sha256sum | awk '{print $1}')
          cp "$GITHUB_WORKSPACE/built-to-offend/deploy/vermalio-prodigi-proxy.js" src/bto-prodigi-proxy.js

          PROXY_HASH="$proxy_hash" node <<'NODE'
          const fs=require('fs');
          let mod=fs.readFileSync('src/bto-prodigi-proxy.js','utf8').replace('__BTO_PROXY_TOKEN_HASH__',process.env.PROXY_HASH);
          if(mod.includes('__BTO_PROXY_TOKEN_HASH__')) throw new Error('Proxy hash replacement failed');
          fs.writeFileSync('src/bto-prodigi-proxy.js',mod);

          const p='src/index.js';
          let s=fs.readFileSync(p,'utf8');
          const imp='import { handleBtoProdigiProxy } from "./bto-prodigi-proxy.js";\n';
          if(!s.includes(imp.trim())) s=imp+s;
          const exportPos=s.indexOf('export default {');
          const marker='    const url = new URL(request.url);\n';
          const markerPos=s.indexOf(marker,exportPos);
          if(exportPos<0||markerPos<0) throw new Error('Current Vermalio route marker not found');
          const route='    if (url.pathname.startsWith("/api/internal/bto/prodigi")) {\n      return handleBtoProdigiProxy(request, env, url);\n    }\n\n';
          if(!s.includes(route)){
            const at=markerPos+marker.length;
            s=s.slice(0,at)+route+s.slice(at);
          }
          if(!s.includes('export class BtoOrderStore')) throw new Error('BtoOrderStore missing from current Vermalio source');
          fs.writeFileSync(p,s);
          NODE

          node --check src/index.js
          node --check src/bto-prodigi-proxy.js
          npx wrangler deploy --dry-run --config wrangler.jsonc
          npx wrangler deploy --config wrangler.jsonc

          code=$(curl -sS --max-time 30 -o /tmp/prodigi-runtime.json -w '%{http_code}' -H "Authorization: Bearer $proxy_token" "$PRODIGI_PROXY_URL/health?environment=live&sku=$PRODIGI_SKU")
          echo "Prodigi runtime health HTTP $code"
          cat /tmp/prodigi-runtime.json
          test "$code" = 200
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/prodigi-runtime.json","utf8")); if(j.ok!==true||j.environment!=="live") process.exit(1)'
          printf '%s' "$proxy_token" >/tmp/bto-proxy-token.txt
          chmod 600 /tmp/bto-proxy-token.txt

      - name: Build and deploy Built To Offend in Prodigi mode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 | base64 -d > .deploy/built-to-offend.tar.xz
          tar -xJf .deploy/built-to-offend.tar.xz -C .deploy
          cp built-to-offend/deploy/0002_secure_tokens.sql "$BTO_DIR/migrations/0002_secure_tokens.sql"
          cd "$BTO_DIR"
          patch -p0 --forward < "$GITHUB_WORKSPACE/built-to-offend/deploy/bto-source.patch"
          node "$GITHUB_WORKSPACE/.github/bto-seo-build.js"
          npm install --no-audit --no-fund

          npx wrangler kv namespace list >/tmp/bto-kv-list.json
          npx wrangler d1 list --json >/tmp/bto-d1-list.json
          node <<'NODE'
          const fs=require('fs');
          const kv=JSON.parse(fs.readFileSync('/tmp/bto-kv-list.json','utf8'));
          const hit=kv.find(x=>x.title==='BTO_PRIVATE_ASSETS'||x.title==='built-to-offend-private-assets'||String(x.title||'').endsWith('-BTO_PRIVATE_ASSETS'));
          if(!hit?.id) throw new Error('BTO_PRIVATE_ASSETS KV namespace missing');
          const d1=JSON.parse(fs.readFileSync('/tmp/bto-d1-list.json','utf8'));
          const db=d1.find(x=>x.name==='built-to-offend-db');
          const dbid=db?.uuid||db?.id||db?.database_id;
          if(!dbid) throw new Error('built-to-offend-db missing');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          delete cfg.r2_buckets;
          cfg.kv_namespaces=[{binding:'ASSET_BUCKET',id:hit.id}];
          cfg.d1_databases=[{binding:'DB',database_name:'built-to-offend-db',database_id:dbid}];
          cfg.vars={...(cfg.vars||{}),PUBLIC_BASE_URL:'https://builttooffend.com',CARD_PRICE_PENCE:'499',UK_SHIPPING_PENCE:'199',PHOTO_ADDON_PENCE:'100',STRIPE_STANDARD_PAYMENT_LINK:'https://buy.stripe.com/14A4gA3IEfWa3O7a5J8so02',STRIPE_PHOTO_PAYMENT_LINK:'https://buy.stripe.com/00w8wQ92YcJY4Sb1zd8so03',PRINT_PROVIDER:'prodigi',PRODIGI_ENV:'live',PRODIGI_SKU:'GLOBAL-GRE-MOH-7X5-DIR',PRODIGI_SHIPPING_METHOD:'Budget',PRODIGI_PROXY_URL:'https://vermalio.stace-walbridge.workers.dev/api/internal/bto/prodigi'};
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE

          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
          proxy_token=$(cat /tmp/bto-proxy-token.txt)
          PROXY_TOKEN="$proxy_token" node <<'NODE'
          const fs=require('fs');
          const token=process.env.PROXY_TOKEN;
          if(!/^[0-9a-f]{64}$/.test(token)) throw new Error('Invalid proxy token');
          const now=new Date().toISOString();
          fs.writeFileSync('/tmp/bto-prodigi-token.sql',`INSERT INTO internal_config(key,value,updated_at) VALUES('prodigi_proxy_token','${token}','${now}') ON CONFLICT(key) DO UPDATE SET value=excluded.value, updated_at=excluded.updated_at;\n`,{mode:0o600});
          NODE
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --file /tmp/bto-prodigi-token.sql >/dev/null
          rm -f /tmp/bto-prodigi-token.sql /tmp/bto-proxy-token.txt

          node --check src/index.js
          node --check public/app.js
          npx wrangler deploy --dry-run --config wrangler.jsonc
          npx wrangler deploy --config wrangler.jsonc

      - name: Verify automatic checkout
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            config=$(curl -fsS --max-time 20 https://builttooffend.com/api/config || true)
            if CONFIG_JSON="$config" node -e 'const c=JSON.parse(process.env.CONFIG_JSON||"{}"); process.exit(c.checkoutReady===true&&c.printer==="prodigi"?0:1)' 2>/dev/null; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo "$config"
          curl -fsS https://builttooffend.com/api/health | grep -q '"ok":true'
          echo 'READY: Stripe payment -> Prodigi automatic print and dispatch.'
