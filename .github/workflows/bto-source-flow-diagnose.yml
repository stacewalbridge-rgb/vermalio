name: BTO Source Flow Diagnose

on:
  push:
    branches: [bto-prodigi-final-fix]
    paths:
      - ".github/workflows/bto-source-flow-diagnose.yml"
      - ".github/bto-ai-reliability-fix.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and validate patched production source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .inspect && mkdir -p .inspect
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 | base64 -d > .inspect/bto.tar.xz
          tar -xJf .inspect/bto.tar.xz -C .inspect
          cd .inspect/built-to-offend-production
          patch -p0 --forward < "$GITHUB_WORKSPACE/built-to-offend/deploy/bto-source.patch"
          node "$GITHUB_WORKSPACE/.github/bto-prodigi-spread-fix.js"
          node "$GITHUB_WORKSPACE/.github/bto-ai-reliability-fix.js" "$PWD"
          node --check src/index.js
          node --check public/app.js

          echo '--- REQUIRED BACKEND RELIABILITY SIGNALS ---'
          grep -n 'AI_MODELS' src/index.js
          grep -n 'monster_model_attempt_failed' src/index.js
          grep -n 'final_safety_check_failed_closed' src/index.js
          grep -n 'All live AI models failed' src/index.js

          echo '--- REQUIRED FRONTEND FAIL-CLOSED SIGNALS ---'
          grep -n 'Nothing has been ordered or charged' public/app.js
          grep -n 'liveConfig.checkoutReady' public/app.js
          grep -n 'regenerateWithAI' public/app.js

          echo '--- FORBIDDEN FALLBACK SIGNALS ---'
          if grep -q 'Using instant local Monster fallback' public/app.js; then echo 'ERROR: silent local generation fallback remains'; exit 21; fi
          if grep -q 'renderCards(localGenerate(lastForm)' public/app.js; then echo 'ERROR: worse/softer still bypass AI'; exit 22; fi
          if grep -q 'return { allowed: true, reason: "" };' src/index.js; then echo 'ERROR: fail-open moderation return remains'; exit 23; fi

          echo 'PATCH_VALIDATION_OK'
