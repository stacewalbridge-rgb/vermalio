name: BTO v2 preflight

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - ".github/workflows/bto-v2-preflight.yml"
      - ".github/bto-ai-transform.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate final source transforms
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/bto-ai-transform.js
          rm -rf .preflight && mkdir .preflight
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 | base64 -d > .preflight/bto.tar.xz
          tar -xJf .preflight/bto.tar.xz -C .preflight
          cd .preflight/built-to-offend-production
          patch -p0 --forward < "$GITHUB_WORKSPACE/built-to-offend/deploy/bto-source.patch"
          node "$GITHUB_WORKSPACE/.github/bto-ai-transform.js"
          node --check src/index.js
          node --check public/app.js
          grep -q '@cf/meta/llama-3.3-70b-instruct-fp8-fast' src/index.js
          grep -q 'response_format:' src/index.js
          grep -q 'type: "json_schema"' src/index.js
          grep -q 'messages: \[{ role: "system", content: SYSTEM }' src/index.js
          if grep -q '@cf/qwen/qwen3-30b-a3b-fp8' src/index.js; then exit 1; fi
          echo 'PRE-FLIGHT PASS: structured Workers AI generation is valid.'
