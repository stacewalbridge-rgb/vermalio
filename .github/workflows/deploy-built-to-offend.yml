name: Deploy Built To Offend to Cloudflare

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - "built-to-offend/**"
      - ".github/workflows/deploy-built-to-offend.yml"
      - ".github/bto-seo-build.js"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      BTO_DIR: ${{ github.workspace }}/.deploy/built-to-offend-production
      PRODIGI_PROXY_URL: https://vermalio.stace-walbridge.workers.dev/api/internal/bto/prodigi
      PRODIGI_SKU: GLOBAL-GRE-MOH-7X5-DIR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack production build and apply secure live-checkout patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 \
            | base64 -d > .deploy/built-to-offend.tar.xz
          tar -xJf .deploy/built-to-offend.tar.xz -C .deploy
          test -f "$BTO_DIR/wrangler.jsonc"
          test -f "$BTO_DIR/src/index.js"
          test -f "$BTO_DIR/public/index.html"
          cp built-to-offend/deploy/0002_secure_tokens.sql "$BTO_DIR/migrations/0002_secure_tokens.sql"
          cd "$BTO_DIR"
          patch -p0 --forward < "$GITHUB_WORKSPACE/built-to-offend/deploy/bto-source.patch"
          node "$GITHUB_WORKSPACE/.github/bto-seo-build.js"

          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete cfg.r2_buckets;
          cfg.kv_namespaces = [{ binding: 'ASSET_BUCKET', id: 'KV_NAMESPACE_ID' }];
          cfg.vars = {
            ...(cfg.vars || {}),
            PUBLIC_BASE_URL: 'https://builttooffend.com',
            CARD_PRICE_PENCE: '499',
            UK_SHIPPING_PENCE: '199',
            PHOTO_ADDON_PENCE: '100',
            STRIPE_STANDARD_PAYMENT_LINK: 'https://buy.stripe.com/14A4gA3IEfWa3O7a5J8so02',
            STRIPE_PHOTO_PAYMENT_LINK: 'https://buy.stripe.com/00w8wQ92YcJY4Sb1zd8so03',
            PRINT_PROVIDER: 'hold',
            PRODIGI_ENV: 'live',
            PRODIGI_SKU: 'GLOBAL-GRE-MOH-7X5-DIR',
            PRODIGI_SHIPPING_METHOD: 'Budget'
          };
          delete cfg.vars.PRODIGI_PROXY_URL;
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Install dependencies and validate patched shop
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check src/index.js
          node --check public/app.js
          test -f public/robots.txt
          test -f public/sitemap.xml
          test -f public/novelty-cards.html
          grep -q 'Funny Personalised' public/index.html
          grep -q 'https://builttooffend.com/sitemap.xml' public/robots.txt

      - name: Authenticate to Cloudflare
        working-directory: .deploy/built-to-offend-production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Using an existing GitHub Actions Cloudflare token."
            npx wrangler whoami
            exit 0
          fi
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          export NO_COLOR=1 FORCE_COLOR=0
          rm -f /tmp/cloudflare-device-login.log
          set +e
          (npx wrangler login --device --browser=false > /tmp/cloudflare-device-login.log 2>&1) &
          login_pid=$!
          set -e
          sleep 8
          printf '\nDeployment run: %s\n\n' "$RUN_URL" >> /tmp/cloudflare-device-login.log
          gh issue create --title "Cloudflare approval required — Built To Offend FINAL — run ${{ github.run_number }}" --body-file /tmp/cloudflare-device-login.log || true
          set +e
          wait "$login_pid"
          rc=$?
          set -e
          cat /tmp/cloudflare-device-login.log || true
          test "$rc" = 0
          npx wrangler whoami

      - name: Create or bind private Workers KV artwork namespace
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          export NO_COLOR=1 FORCE_COLOR=0
          npx wrangler kv namespace list > /tmp/bto-kv-list.json
          kv_id=$(node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync('/tmp/bto-kv-list.json', 'utf8'));
          const hit = list.find(x => x.title === 'BTO_PRIVATE_ASSETS' || x.title === 'built-to-offend-private-assets' || String(x.title || '').endsWith('-BTO_PRIVATE_ASSETS'));
          if (hit?.id) process.stdout.write(hit.id);
          NODE
          )
          if [ -z "$kv_id" ]; then
            npx wrangler kv namespace create BTO_PRIVATE_ASSETS --config wrangler.jsonc
            npx wrangler kv namespace list > /tmp/bto-kv-list.json
            kv_id=$(node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync('/tmp/bto-kv-list.json', 'utf8'));
          const hit = list.find(x => x.title === 'BTO_PRIVATE_ASSETS' || x.title === 'built-to-offend-private-assets' || String(x.title || '').endsWith('-BTO_PRIVATE_ASSETS'));
          if (!hit?.id) throw new Error('Private artwork KV namespace was not found');
          process.stdout.write(hit.id);
          NODE
            )
          fi
          KV_ID="$kv_id" node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
          cfg.kv_namespaces = [{ binding: 'ASSET_BUCKET', id: process.env.KV_ID }];
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Bind existing D1 order database
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          export NO_COLOR=1 FORCE_COLOR=0
          npx wrangler d1 list --json > /tmp/d1-list.json
          node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const db = list.find(x => x.name === 'built-to-offend-db');
          if (!db) throw new Error('Existing D1 database built-to-offend-db was not found');
          const id = db.uuid || db.id || db.database_id;
          if (!id) throw new Error('D1 database ID was not present');
          const path = 'wrangler.jsonc';
          const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
          cfg.d1_databases = [{ binding: 'DB', database_name: 'built-to-offend-db', database_id: id }];
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Apply secure order migrations
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Prepare Vermalio fulfilment bridge and detect existing Prodigi key
        id: prodigi_secret
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          rm -rf /tmp/vermalio-live
          git fetch --depth=1 origin built-to-offend-prodigi-webhook:refs/remotes/origin/built-to-offend-prodigi-webhook
          git worktree add --detach /tmp/vermalio-live origin/built-to-offend-prodigi-webhook
          cd /tmp/vermalio-live
          npm install --no-audit --no-fund
          npx wrangler secret list --config wrangler.jsonc > /tmp/vermalio-secret-list.json
          if node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync('/tmp/vermalio-secret-list.json', 'utf8'));
          const names = new Set(list.map(x => x.name));
          const found = ['PRODIGI_API_KEY','PRODIGI_LIVE_API_KEY','PRODIGI_KEY'].some(name => names.has(name));
          process.exit(found ? 0 : 1);
          NODE
          then
            echo "has_prodigi=true" >> "$GITHUB_OUTPUT"
            echo "Existing Prodigi credential found on Vermalio."
          else
            echo "has_prodigi=false" >> "$GITHUB_OUTPUT"
            echo "No Prodigi API credential is attached to Vermalio; checkout will remain closed."
          fi
          rm -f /tmp/vermalio-secret-list.json

      - name: Deploy and verify private Prodigi bridge
        if: steps.prodigi_secret.outputs.has_prodigi == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          proxy_token=$(openssl rand -hex 32)
          proxy_hash=$(printf '%s' "$proxy_token" | sha256sum | awk '{print $1}')

          cp "$GITHUB_WORKSPACE/built-to-offend/deploy/vermalio-prodigi-proxy.js" /tmp/vermalio-live/src/bto-prodigi-proxy.js
          PROXY_HASH="$proxy_hash" node <<'NODE'
          const fs = require('fs');
          const modulePath = '/tmp/vermalio-live/src/bto-prodigi-proxy.js';
          let mod = fs.readFileSync(modulePath, 'utf8');
          mod = mod.replace('__BTO_PROXY_TOKEN_HASH__', process.env.PROXY_HASH);
          if (mod.includes('__BTO_PROXY_TOKEN_HASH__')) throw new Error('Proxy token hash placeholder remains');
          fs.writeFileSync(modulePath, mod);
          const indexPath = '/tmp/vermalio-live/src/index.js';
          let source = fs.readFileSync(indexPath, 'utf8');
          const importLine = 'import { handleBtoProdigiProxy } from "./bto-prodigi-proxy.js";\n';
          if (!source.includes(importLine.trim())) source = importLine + source;
          const exportPos = source.indexOf('export default {');
          const marker = '    const url = new URL(request.url);\n';
          const markerPos = source.indexOf(marker, exportPos);
          if (exportPos < 0 || markerPos < 0) throw new Error('Vermalio Worker route marker not found');
          const route = '    if (url.pathname.startsWith("/api/internal/bto/prodigi")) {\n      return handleBtoProdigiProxy(request, env, url);\n    }\n\n';
          if (!source.includes(route)) {
            const insertAt = markerPos + marker.length;
            source = source.slice(0, insertAt) + route + source.slice(insertAt);
          }
          fs.writeFileSync(indexPath, source);
          NODE

          cd /tmp/vermalio-live
          node --check src/index.js
          node --check src/bto-prodigi-proxy.js
          npx wrangler deploy --dry-run --config wrangler.jsonc
          npx wrangler deploy --config wrangler.jsonc

          set +e
          http_code=$(curl -sS --max-time 30 -o /tmp/prodigi-health.json -w '%{http_code}' -H "Authorization: Bearer $proxy_token" "$PRODIGI_PROXY_URL/health?sku=$PRODIGI_SKU")
          set -e
          proxy_ok=0
          if [ "$http_code" = "200" ] && node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/prodigi-health.json","utf8")); process.exit(j.ok===true?0:1)'; then
            proxy_ok=1
          fi

          if [ "$proxy_ok" = "1" ]; then
            PROXY_TOKEN="$proxy_token" node <<'NODE'
          const fs = require('fs');
          const token = process.env.PROXY_TOKEN;
          if (!/^[0-9a-f]{64}$/.test(token)) throw new Error('Invalid generated bridge token');
          const now = new Date().toISOString();
          fs.writeFileSync('/tmp/bto-prodigi-token.sql', `INSERT INTO internal_config(key,value,updated_at) VALUES('prodigi_proxy_token','${token}','${now}') ON CONFLICT(key) DO UPDATE SET value=excluded.value, updated_at=excluded.updated_at;\n`, { mode: 0o600 });
          NODE
            cd "$BTO_DIR"
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --file /tmp/bto-prodigi-token.sql > /tmp/bto-prodigi-token-result.txt
            rm -f /tmp/bto-prodigi-token.sql /tmp/bto-prodigi-token-result.txt
            PRODIGI_PROXY_URL="$PRODIGI_PROXY_URL" node <<'NODE'
          const fs = require('fs');
          const p = 'wrangler.jsonc';
          const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
          cfg.vars = cfg.vars || {};
          cfg.vars.PRINT_PROVIDER = 'prodigi';
          cfg.vars.PRODIGI_ENV = 'live';
          cfg.vars.PRODIGI_PROXY_URL = process.env.PRODIGI_PROXY_URL;
          fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + '\n');
          NODE
            echo "Live Prodigi validation passed; automatic fulfilment enabled."
          else
            echo "Live Prodigi validation failed (HTTP $http_code); checkout remains safely closed."
            cat /tmp/prodigi-health.json || true
          fi
          rm -f /tmp/prodigi-health.json
          unset proxy_token proxy_hash

      - name: Validate and deploy Built To Offend live shop
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          node --check src/index.js
          npx wrangler deploy --dry-run --config wrangler.jsonc
          npx wrangler deploy --config wrangler.jsonc

      - name: Verify live ordering readiness and SEO
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 18); do
            body=$(curl -fsS --max-time 20 https://builttooffend.com/api/health || true)
            if [[ "$body" == *'"ok":true'* ]]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "ERROR: live /api/health did not become ready"
            exit 1
          fi

          config=$(curl -fsS --retry 3 --retry-delay 2 --max-time 20 https://builttooffend.com/api/config)
          echo "$config"
          CONFIG_JSON="$config" node <<'NODE'
          const cfg = JSON.parse(process.env.CONFIG_JSON);
          if (cfg.checkoutReady !== true || cfg.printer !== 'prodigi') {
            console.error('Live ordering is not ready because Prodigi live validation did not pass.');
            process.exit(1);
          }
          console.log('READY: Stripe payment -> Prodigi automatic fulfilment.');
          NODE

          check_contains() {
            local label="$1"
            local url="$2"
            local needle="$3"
            local body
            body=$(curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$url") || {
              echo "ERROR: $label could not be fetched: $url"
              return 1
            }
            if [[ "$body" != *"$needle"* ]]; then
              echo "ERROR: $label is missing expected text: $needle"
              return 1
            fi
            echo "OK: $label"
          }

          check_status() {
            local label="$1"
            local url="$2"
            local code
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 20 "$url")
            if [[ "$code" != 2* && "$code" != 3* ]]; then
              echo "ERROR: $label returned HTTP $code: $url"
              return 1
            fi
            echo "OK: $label HTTP $code"
          }

          check_contains "robots.txt sitemap declaration" "https://builttooffend.com/robots.txt" "Sitemap: https://builttooffend.com/sitemap.xml"
          check_contains "sitemap novelty page" "https://builttooffend.com/sitemap.xml" "novelty-cards.html"
          check_contains "novelty landing page" "https://builttooffend.com/novelty-cards.html" "Novelty Greeting Cards"
          check_contains "homepage canonical" "https://builttooffend.com/" 'rel="canonical" href="https://builttooffend.com/"'
          check_status "www .com alias" "https://www.builttooffend.com/"
          check_status ".co.uk alias" "https://builttooffend.co.uk/"
          check_status "www .co.uk alias" "https://www.builttooffend.co.uk/"
          echo "READY: live ordering and SEO verification passed."
