name: Deploy Built To Offend to Cloudflare

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - "built-to-offend/**"
      - ".github/workflows/deploy-built-to-offend.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 \
            | base64 -d > .deploy/built-to-offend.tar.xz
          tar -xJf .deploy/built-to-offend.tar.xz -C .deploy
          test -f .deploy/built-to-offend-production/wrangler.jsonc
          test -f .deploy/built-to-offend-production/src/index.js
          test -f .deploy/built-to-offend-production/public/index.html

      - name: Switch private artwork storage from R2 to Workers KV
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const sourcePath = 'src/index.js';
          let source = fs.readFileSync(sourcePath, 'utf8');
          const oldPut = `  const key = \`orders/\${orderId}/\${kind}.\${contentType.includes("jpeg") ? "jpg" : "png"}\`;\n  await env.ASSET_BUCKET.put(key, bytes, { httpMetadata: { contentType, cacheControl: "private, max-age=0" } });\n  const field = kind === "outside" ? "outside_asset_key" : "inside_asset_key";`;
          const newPut = `  const key = \`orders/\${orderId}/\${kind}.\${contentType.includes("jpeg") ? "jpg" : "png"}\`;\n  await env.ASSET_BUCKET.put(key, bytes, {\n    expirationTtl: DESIGN_TTL_SECONDS * 4,\n    metadata: { contentType },\n  });\n  const field = kind === "outside" ? "outside_asset_key" : "inside_asset_key";`;
          if (!source.includes(oldPut)) throw new Error('Artwork upload block was not found');
          source = source.replace(oldPut, newPut);
          const oldGet = `  const object = await env.ASSET_BUCKET.get(key);\n  if (!object) return new Response("Not found", { status: 404 });\n  return new Response(object.body, {\n    headers: {\n      "content-type": object.httpMetadata?.contentType || "image/png",\n      "cache-control": "private, no-store",\n      "x-content-type-options": "nosniff",\n    },\n  });`;
          const newGet = `  const object = await env.ASSET_BUCKET.getWithMetadata(key, "arrayBuffer");\n  if (!object?.value) return new Response("Not found", { status: 404 });\n  return new Response(object.value, {\n    headers: {\n      "content-type": object.metadata?.contentType || "image/png",\n      "cache-control": "private, no-store",\n      "x-content-type-options": "nosniff",\n    },\n  });`;
          if (!source.includes(oldGet)) throw new Error('Artwork retrieval block was not found');
          source = source.replace(oldGet, newGet);
          fs.writeFileSync(sourcePath, source);
          const configPath = 'wrangler.jsonc';
          let config = fs.readFileSync(configPath, 'utf8');
          if (!/"r2_buckets"\s*:\s*\[[\s\S]*?\]/m.test(config)) throw new Error('R2 binding block not found');
          config = config.replace(/"r2_buckets"\s*:\s*\[[\s\S]*?\]/m, `"kv_namespaces": [\n    { "binding": "ASSET_BUCKET", "id": "KV_NAMESPACE_ID" }\n  ]`);
          fs.writeFileSync(configPath, config);
          NODE

      - name: Install dependencies and validate JavaScript
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check src/index.js
          node --check public/app.js

      - name: Publish checkout diagnostics
        working-directory: .deploy/built-to-offend-production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## src/index.js checkout/config snippets'
            grep -n -C 8 -E 'checkoutReady|STRIPE|stripe|checkout|api/config|payment' src/index.js | head -500 || true
            echo
            echo '## public/app.js checkout snippets'
            grep -n -C 8 -E 'checkout|payment|buy|order' public/app.js | head -500 || true
            echo
            echo '## wrangler variables'
            cat wrangler.jsonc
          } > /tmp/bto-checkout-diagnostics.txt
          gh issue create --title "Built To Offend checkout diagnostics — run ${{ github.run_number }}" --body-file /tmp/bto-checkout-diagnostics.txt

      - name: Authenticate to Cloudflare
        working-directory: .deploy/built-to-offend-production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Using an existing GitHub Actions Cloudflare token."
            npx wrangler whoami
            exit 0
          fi
          echo "No stored deployment token; starting Cloudflare secure device authorization."
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          export NO_COLOR=1 FORCE_COLOR=0
          rm -f /tmp/cloudflare-device-login.log
          set +e
          (npx wrangler login --device --browser=false > /tmp/cloudflare-device-login.log 2>&1) &
          login_pid=$!
          set -e
          sleep 8
          printf '\nDeployment run: %s\n\n' "$RUN_URL" >> /tmp/cloudflare-device-login.log
          gh issue create --title "Cloudflare approval required — Built To Offend — run ${{ github.run_number }}" --body-file /tmp/cloudflare-device-login.log || true
          set +e
          wait "$login_pid"
          rc=$?
          set -e
          cat /tmp/cloudflare-device-login.log || true
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          npx wrangler whoami

      - name: Create or bind private Workers KV artwork namespace
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          export NO_COLOR=1 FORCE_COLOR=0
          npx wrangler kv namespace list > /tmp/bto-kv-list.json
          kv_id=$(node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync('/tmp/bto-kv-list.json', 'utf8'));
          const hit = list.find(x => x.title === 'built-to-offend-private-assets' || x.title === 'BTO_PRIVATE_ASSETS' || String(x.title || '').endsWith('-BTO_PRIVATE_ASSETS'));
          if (hit?.id) process.stdout.write(hit.id);
          NODE
          )
          if [ -z "$kv_id" ]; then
            npx wrangler kv namespace create BTO_PRIVATE_ASSETS --config wrangler.jsonc
            npx wrangler kv namespace list > /tmp/bto-kv-list.json
            kv_id=$(node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync('/tmp/bto-kv-list.json', 'utf8'));
          const hit = list.find(x => x.title === 'built-to-offend-private-assets' || x.title === 'BTO_PRIVATE_ASSETS' || String(x.title || '').endsWith('-BTO_PRIVATE_ASSETS'));
          if (!hit?.id) throw new Error('New private KV namespace could not be found');
          process.stdout.write(hit.id);
          NODE
            )
          fi
          KV_ID="$kv_id" node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          let s = fs.readFileSync(path, 'utf8');
          s = s.replace('KV_NAMESPACE_ID', process.env.KV_ID);
          if (s.includes('KV_NAMESPACE_ID')) throw new Error('KV placeholder remains in config');
          fs.writeFileSync(path, s);
          NODE

      - name: Bind existing D1 database
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          export NO_COLOR=1 FORCE_COLOR=0
          npx wrangler d1 list --json > /tmp/d1-list.json
          node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const db = list.find(x => x.name === 'built-to-offend-db');
          if (!db) throw new Error('Existing D1 database built-to-offend-db was not found');
          const id = db.uuid || db.id || db.database_id;
          if (!id) throw new Error('D1 database ID was not present');
          const path = 'wrangler.jsonc';
          let s = fs.readFileSync(path, 'utf8');
          const replacement = `"d1_databases": [\n    { "binding": "DB", "database_name": "built-to-offend-db", "database_id": "${id}" }\n  ]`;
          s = s.replace(/"d1_databases"\s*:\s*\[[\s\S]*?\]/m, replacement);
          fs.writeFileSync(path, s);
          NODE

      - name: Check configured Worker secret names
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set +e
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx wrangler secret list --config wrangler.jsonc
          exit 0

      - name: Validate final Worker bundle
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy Worker, D1 and private KV artwork storage
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy --config wrangler.jsonc

      - name: Apply D1 order migrations
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Verify live site and checkout readiness
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 20 https://builttooffend.com/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          curl -fsS https://builttooffend.com/api/config
          curl -fsSI https://www.builttooffend.com/ | head -20
          curl -fsSI https://builttooffend.co.uk/ | head -20
          curl -fsSI https://www.builttooffend.co.uk/ | head -20
