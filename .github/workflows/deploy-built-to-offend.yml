name: Deploy Built To Offend to Cloudflare

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - "built-to-offend/**"
      - ".github/workflows/deploy-built-to-offend.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 | base64 -d > .deploy/built-to-offend.tar.xz
          tar -xJf .deploy/built-to-offend.tar.xz -C .deploy
          test -f .deploy/built-to-offend-production/wrangler.jsonc
          test -f .deploy/built-to-offend-production/src/index.js
          test -f .deploy/built-to-offend-production/public/app.js

      - name: Patch private storage and live Stripe checkout
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const sourcePath = 'src/index.js';
          let source = fs.readFileSync(sourcePath, 'utf8');

          const oldPut = `  const key = \`orders/\${orderId}/\${kind}.\${contentType.includes("jpeg") ? "jpg" : "png"}\`;\n  await env.ASSET_BUCKET.put(key, bytes, { httpMetadata: { contentType, cacheControl: "private, max-age=0" } });\n  const field = kind === "outside" ? "outside_asset_key" : "inside_asset_key";`;
          const newPut = `  const key = \`orders/\${orderId}/\${kind}.\${contentType.includes("jpeg") ? "jpg" : "png"}\`;\n  await env.ASSET_BUCKET.put(key, bytes, { expirationTtl: DESIGN_TTL_SECONDS * 4, metadata: { contentType } });\n  const field = kind === "outside" ? "outside_asset_key" : "inside_asset_key";`;
          if (!source.includes(oldPut)) throw new Error('Artwork upload block not found');
          source = source.replace(oldPut, newPut);

          const oldGet = `  const object = await env.ASSET_BUCKET.get(key);\n  if (!object) return new Response("Not found", { status: 404 });\n  return new Response(object.body, {\n    headers: {\n      "content-type": object.httpMetadata?.contentType || "image/png",\n      "cache-control": "private, no-store",\n      "x-content-type-options": "nosniff",\n    },\n  });`;
          const newGet = `  const object = await env.ASSET_BUCKET.getWithMetadata(key, "arrayBuffer");\n  if (!object?.value) return new Response("Not found", { status: 404 });\n  return new Response(object.value, {\n    headers: {\n      "content-type": object.metadata?.contentType || "image/png",\n      "cache-control": "private, no-store",\n      "x-content-type-options": "nosniff",\n    },\n  });`;
          if (!source.includes(oldGet)) throw new Error('Artwork retrieval block not found');
          source = source.replace(oldGet, newGet);

          const checkoutReplacement = `async function createCheckout(request, env) {
            if (!env.DB) return json({ error: "Order database is not connected yet." }, 503);
            const body = await parseJsonLimited(request);
            const orderId = clean(body.orderId, 80);
            const token = clean(body.uploadToken, 200);
            if (!(await verifyUploadToken(orderId, token, env))) return json({ error: "Order token expired. Please select the card again." }, 401);
            const order = await env.DB.prepare("SELECT * FROM orders WHERE id=?").bind(orderId).first();
            if (!order) return json({ error: "Order not found" }, 404);
            if (!order.outside_asset_key || !order.inside_asset_key) return json({ error: "Print artwork is still being prepared. Try again." }, 409);
            if (order.status !== "draft") return json({ error: "This order has already been sent to checkout." }, 409);
            const link = order.art_mode === "photo" ? env.STRIPE_PHOTO_PAYMENT_LINK : env.STRIPE_STANDARD_PAYMENT_LINK;
            if (!link) return json({ error: "Secure checkout is not connected yet." }, 503);
            const checkoutUrl = link + (link.includes("?") ? "&" : "?") + "client_reference_id=" + encodeURIComponent(orderId);
            await env.DB.prepare("UPDATE orders SET status='checkout', updated_at=? WHERE id=?").bind(new Date().toISOString(), orderId).run();
            return json({ checkoutUrl });
          }`;
          const checkoutRegex = /async function createCheckout\(request, env\) \{[\s\S]*?\n\}\n\nfunction parseStripeSignature/;
          if (!checkoutRegex.test(source)) throw new Error('Checkout function block not found');
          source = source.replace(checkoutRegex, checkoutReplacement + '\n\nfunction parseStripeSignature');

          const completedOld = `if (event.type === "checkout.session.completed" && event.data?.object?.payment_status === "paid") {`;
          const completedNew = `if ((event.type === "checkout.session.completed" && event.data?.object?.payment_status === "paid") || event.type === "checkout.session.async_payment_succeeded") {`;
          if (!source.includes(completedOld)) throw new Error('Stripe completion condition not found');
          source = source.replace(completedOld, completedNew);

          const updateOld = `      await env.DB.prepare(\`UPDATE orders SET status='paid', stripe_payment_intent=?, customer_email=?, shipping_json=?, updated_at=? WHERE id=? AND status IN ('checkout','draft')\`)\n        .bind(session.payment_intent || null, session.customer_details?.email || null, JSON.stringify(shipping || {}), new Date().toISOString(), orderId).run();`;
          const updateNew = `      await env.DB.prepare(\`UPDATE orders SET status='paid', stripe_session_id=?, stripe_payment_intent=?, customer_email=?, shipping_json=?, updated_at=? WHERE id=? AND status IN ('checkout','draft')\`)\n        .bind(session.id || null, session.payment_intent || null, session.customer_details?.email || null, JSON.stringify(shipping || {}), new Date().toISOString(), orderId).run();`;
          if (!source.includes(updateOld)) throw new Error('Stripe paid-order update block not found');
          source = source.replace(updateOld, updateNew);

          const fulfillOld = `      ctx.waitUntil(fulfillOrder(orderId, env).catch(() => {}));`;
          const fulfillNew = `      if ((env.PRINT_PROVIDER || "hold").toLowerCase() !== "hold") ctx.waitUntil(fulfillOrder(orderId, env).catch(() => {}));`;
          if (!source.includes(fulfillOld)) throw new Error('Fulfilment trigger not found');
          source = source.replace(fulfillOld, fulfillNew);

          const readyOld = `          checkoutReady: Boolean(env.STRIPE_SECRET_KEY && env.DB && env.ASSET_BUCKET),`;
          const readyNew = `          checkoutReady: Boolean(env.STRIPE_STANDARD_PAYMENT_LINK && env.STRIPE_PHOTO_PAYMENT_LINK && env.STRIPE_WEBHOOK_SECRET && env.DB && env.ASSET_BUCKET),`;
          if (!source.includes(readyOld)) throw new Error('Checkout readiness line not found');
          source = source.replace(readyOld, readyNew);
          fs.writeFileSync(sourcePath, source);

          const configPath = 'wrangler.jsonc';
          let configText = fs.readFileSync(configPath, 'utf8');
          if (!/"r2_buckets"\s*:\s*\[[\s\S]*?\]/m.test(configText)) throw new Error('R2 binding block not found');
          configText = configText.replace(/"r2_buckets"\s*:\s*\[[\s\S]*?\]/m, `"kv_namespaces": [\n    { "binding": "ASSET_BUCKET", "id": "KV_NAMESPACE_ID" }\n  ]`);
          const cfg = JSON.parse(configText);
          cfg.vars = cfg.vars || {};
          cfg.vars.STRIPE_STANDARD_PAYMENT_LINK = 'https://buy.stripe.com/bJe9AUa724dsgAT0v98so00';
          cfg.vars.STRIPE_PHOTO_PAYMENT_LINK = 'https://buy.stripe.com/9B6fZi0ws7pEgAT1zd8so01';
          cfg.vars.PRINT_PROVIDER = 'hold';
          fs.writeFileSync(configPath, JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Install dependencies and validate
        working-directory: .deploy/built-to-offend-production
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check src/index.js
          node --check public/app.js
          grep -q 'STRIPE_STANDARD_PAYMENT_LINK' src/index.js
          grep -q 'client_reference_id' src/index.js

      - name: Authenticate to Cloudflare
        working-directory: .deploy/built-to-offend-production
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then npx wrangler whoami; exit 0; fi
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          export NO_COLOR=1 FORCE_COLOR=0
          rm -f /tmp/cloudflare-device-login.log
          set +e
          (npx wrangler login --device --browser=false > /tmp/cloudflare-device-login.log 2>&1) &
          login_pid=$!
          set -e
          sleep 8
          printf '\nDeployment run: %s\n\n' "$RUN_URL" >> /tmp/cloudflare-device-login.log
          gh issue create --title "Cloudflare approval required — Built To Offend LIVE checkout — run ${{ github.run_number }}" --body-file /tmp/cloudflare-device-login.log || true
          set +e
          wait "$login_pid"
          rc=$?
          set -e
          cat /tmp/cloudflare-device-login.log || true
          test "$rc" = 0
          npx wrangler whoami

      - name: Bind existing KV and D1
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          export NO_COLOR=1 FORCE_COLOR=0
          npx wrangler kv namespace list > /tmp/bto-kv-list.json
          kv_id=$(node -e "const x=require('/tmp/bto-kv-list.json');const h=x.find(v=>v.title==='BTO_PRIVATE_ASSETS'||String(v.title||'').endsWith('-BTO_PRIVATE_ASSETS'));if(h)process.stdout.write(h.id)")
          test -n "$kv_id"
          KV_ID="$kv_id" node <<'NODE'
          const fs=require('fs'); const p='wrangler.jsonc'; const cfg=JSON.parse(fs.readFileSync(p,'utf8')); cfg.kv_namespaces=[{binding:'ASSET_BUCKET',id:process.env.KV_ID}]; fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx wrangler d1 list --json > /tmp/d1-list.json
          db_id=$(node -e "const x=require('/tmp/d1-list.json');const h=x.find(v=>v.name==='built-to-offend-db');if(h)process.stdout.write(h.uuid||h.id||h.database_id||'')")
          test -n "$db_id"
          DB_ID="$db_id" node <<'NODE'
          const fs=require('fs'); const p='wrangler.jsonc'; const cfg=JSON.parse(fs.readFileSync(p,'utf8')); cfg.d1_databases=[{binding:'DB',database_name:'built-to-offend-db',database_id:process.env.DB_ID}]; fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE

      - name: Secure Stripe webhook secret handoff
        working-directory: .deploy/built-to-offend-production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/bto-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/bto-private.pem -pubout -out /tmp/bto-public.pem >/dev/null 2>&1
          pub=$(base64 -w0 /tmp/bto-public.pem)
          issue_url=$(gh issue create --title "Built To Offend encrypted Stripe secret handoff — run ${{ github.run_number }}" --body "BTO_SECRET_PUBLIC_KEY_B64:${pub}\n\nPost only an RSA-OAEP/SHA-256 encrypted ciphertext. Plaintext secrets must never be posted here.")
          issue_num=${issue_url##*/}
          enc=''
          for i in $(seq 1 72); do
            enc=$(gh issue view "$issue_num" --json comments --jq -r '.comments[].body' | sed -n 's/^BTO_ENCRYPTED_STRIPE_WEBHOOK_SECRET://p' | tail -1)
            if [ -n "$enc" ]; then break; fi
            sleep 5
          done
          test -n "$enc"
          printf '%s' "$enc" | base64 -d > /tmp/bto-secret.enc
          openssl pkeyutl -decrypt -inkey /tmp/bto-private.pem -in /tmp/bto-secret.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 > /tmp/bto-stripe-webhook.secret
          test -s /tmp/bto-stripe-webhook.secret
          cat /tmp/bto-stripe-webhook.secret | npx wrangler secret put STRIPE_WEBHOOK_SECRET --config wrangler.jsonc
          rm -f /tmp/bto-private.pem /tmp/bto-public.pem /tmp/bto-secret.enc /tmp/bto-stripe-webhook.secret
          gh issue close "$issue_num" --comment "Encrypted handoff consumed and Cloudflare secret installed. No plaintext secret was written to GitHub."

      - name: Validate and deploy
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy --dry-run --config wrangler.jsonc
          npx wrangler deploy --config wrangler.jsonc
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
          echo 'Configured Worker secrets:'
          npx wrangler secret list --config wrangler.jsonc

      - name: Verify live checkout
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            config=$(curl -fsS --max-time 20 https://builttooffend.com/api/config || true)
            echo "$config"
            if echo "$config" | grep -q '"checkoutReady":true'; then break; fi
            sleep 10
          done
          echo "$config" | grep -q '"checkoutReady":true'
          curl -fsS https://builttooffend.com/api/health | grep -q '"ok":true'
          curl -fsSI https://www.builttooffend.com/ | head -20
          curl -fsSI https://builttooffend.co.uk/ | head -20
          curl -fsSI https://www.builttooffend.co.uk/ | head -20
