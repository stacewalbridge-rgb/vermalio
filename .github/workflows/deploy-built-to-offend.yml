name: Deploy Built To Offend to Cloudflare

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - "built-to-offend/**"
      - ".github/workflows/deploy-built-to-offend.yml"
      - ".github/bto-seo-build.js"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      BTO_DIR: ${{ github.workspace }}/.deploy/built-to-offend-production
      PRODIGI_SKU: GLOBAL-GRE-MOH-7X5-DIR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Receive Prodigi live key through encrypted one-time handoff
        id: prodigi_handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/bto-prodigi-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/bto-prodigi-private.pem -pubout -out /tmp/bto-prodigi-public.pem >/dev/null 2>&1
          pub=$(base64 -w0 /tmp/bto-prodigi-public.pem)
          cat >/tmp/handoff-body.txt <<EOF
          BTO_PRODIGI_PUBLIC_KEY_B64:$pub

          Post only RSA-OAEP/SHA-256 encrypted ciphertext beginning PRODIGI_SECRET_CIPHERTEXT_B64:. Never post plaintext.
          EOF
          issue_url=$(gh issue create --title "Built To Offend encrypted Prodigi key handoff — deploy run ${{ github.run_number }}" --body-file /tmp/handoff-body.txt)
          issue_number=${issue_url##*/}
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "Waiting for encrypted Prodigi key handoff on issue #$issue_number"
          cipher=""
          for attempt in $(seq 1 180); do
            cipher=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" --jq '.[].body' 2>/dev/null | sed -n 's/^PRODIGI_SECRET_CIPHERTEXT_B64://p' | tr -d '\r\n\t ' | tail -1 || true)
            if [ -n "$cipher" ]; then break; fi
            sleep 2
          done
          test -n "$cipher"
          printf '%s' "$cipher" | base64 -d >/tmp/prodigi-key.enc
          openssl pkeyutl -decrypt -inkey /tmp/bto-prodigi-private.pem -in /tmp/prodigi-key.enc -out /tmp/prodigi-key.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          PRODIGI_KEY=$(cat /tmp/prodigi-key.txt)
          test ${#PRODIGI_KEY} -ge 20
          echo "::add-mask::$PRODIGI_KEY"
          chmod 600 /tmp/prodigi-key.txt
          rm -f /tmp/prodigi-key.enc /tmp/bto-prodigi-private.pem /tmp/bto-prodigi-public.pem /tmp/handoff-body.txt

      - name: Rebuild exact shop and apply final secure Prodigi patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 \
            | base64 -d > .deploy/built-to-offend.tar.xz
          tar -xJf .deploy/built-to-offend.tar.xz -C .deploy
          test -f "$BTO_DIR/wrangler.jsonc"
          test -f "$BTO_DIR/src/index.js"
          test -f "$BTO_DIR/public/app.js"
          cp built-to-offend/deploy/0002_secure_tokens.sql "$BTO_DIR/migrations/0002_secure_tokens.sql"
          cd "$BTO_DIR"
          patch -p0 --forward < "$GITHUB_WORKSPACE/built-to-offend/deploy/bto-source.patch"
          patch -p0 --forward < "$GITHUB_WORKSPACE/built-to-offend/deploy/prodigi-single-asset.patch"
          node "$GITHUB_WORKSPACE/.github/bto-seo-build.js"

          node <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          delete cfg.r2_buckets;
          cfg.kv_namespaces=[{binding:'ASSET_BUCKET',id:'4935699f8f314459950e7e2c8c16fa77'}];
          cfg.d1_databases=[{binding:'DB',database_name:'built-to-offend-db',database_id:'8785a79e-4386-4cfe-bda9-7823632d5b2f'}];
          cfg.vars={
            ...(cfg.vars||{}),
            PUBLIC_BASE_URL:'https://builttooffend.com',
            CARD_PRICE_PENCE:'499',
            UK_SHIPPING_PENCE:'199',
            PHOTO_ADDON_PENCE:'100',
            STRIPE_STANDARD_PAYMENT_LINK:'https://buy.stripe.com/14A4gA3IEfWa3O7a5J8so02',
            STRIPE_PHOTO_PAYMENT_LINK:'https://buy.stripe.com/00w8wQ92YcJY4Sb1zd8so03',
            PRINT_PROVIDER:'prodigi',
            PRODIGI_ENV:'live',
            PRODIGI_SKU:'GLOBAL-GRE-MOH-7X5-DIR',
            PRODIGI_SHIPPING_METHOD:'Budget'
          };
          delete cfg.vars.PRODIGI_PROXY_URL;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE

      - name: Install dependencies and validate production build
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check src/index.js
          node --check public/app.js
          grep -q 'W=6118,H=2161' public/app.js
          grep -q "uploadAsset(order.orderId,order.uploadToken,'print',printBlob)" public/app.js
          grep -q 'assets: \[{ printArea: "default", url: printUrl }\]' src/index.js
          grep -q 'outcome === "createdwithissues"' src/index.js
          test -f public/robots.txt
          test -f public/sitemap.xml
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Validate Prodigi live key, UK card SKU and print canvas before Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          PRODIGI_KEY=$(cat /tmp/prodigi-key.txt)
          echo "::add-mask::$PRODIGI_KEY"
          code=$(curl -sS --max-time 30 -o /tmp/prodigi-product.json -w '%{http_code}' -H "X-API-Key: $PRODIGI_KEY" "https://api.prodigi.com/v4.0/products/$PRODIGI_SKU")
          test "$code" = 200
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/prodigi-product.json','utf8'));
          if(String(j?.outcome||'').toLowerCase()!=='ok') throw new Error('Prodigi live product lookup did not return Ok');
          const p=j.product||j;
          if(!p?.printAreas?.default?.required) throw new Error('Prodigi default print area is not required/available');
          const gb=(p.variants||[]).find(v=>Array.isArray(v.shipsTo)&&v.shipsTo.includes('GB'));
          const size=gb?.printAreaSizes?.default;
          if(Number(size?.horizontalResolution)!==6118||Number(size?.verticalResolution)!==2161) throw new Error('Prodigi 7x5 direct card dimensions changed');
          console.log('PRODIGI_VALIDATED: live key + GB direct card + 6118x2161 default print area');
          NODE
          rm -f /tmp/prodigi-product.json

      - name: Authenticate to Cloudflare once
        id: cloudflare_auth
        working-directory: .deploy/built-to-offend-production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Using existing GitHub Actions Cloudflare token."
            npx wrangler whoami
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          export NO_COLOR=1 FORCE_COLOR=0
          rm -f /tmp/cloudflare-device-login.log
          set +e
          (npx wrangler login --device --browser=false >/tmp/cloudflare-device-login.log 2>&1) &
          login_pid=$!
          set -e
          for poll in $(seq 1 45); do
            if grep -q 'enter the code' /tmp/cloudflare-device-login.log 2>/dev/null; then break; fi
            sleep 1
          done
          grep -q 'enter the code' /tmp/cloudflare-device-login.log
          printf '\nDeployment run: %s\n\n' "$RUN_URL" >>/tmp/cloudflare-device-login.log
          issue_url=$(gh issue create --title "Cloudflare approval required — BUILT TO OFFEND PRODIGI LIVE — run ${{ github.run_number }}" --body-file /tmp/cloudflare-device-login.log)
          issue_number=${issue_url##*/}
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          set +e
          wait "$login_pid"
          rc=$?
          set -e
          cat /tmp/cloudflare-device-login.log || true
          test "$rc" = 0
          npx wrangler whoami

      - name: Install Prodigi runtime secret, migrate and deploy
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; fi
          PRODIGI_KEY=$(cat /tmp/prodigi-key.txt)
          echo "::add-mask::$PRODIGI_KEY"
          printf '%s' "$PRODIGI_KEY" | npx wrangler secret put PRODIGI_API_KEY --config wrangler.jsonc >/tmp/bto-secret-put.log 2>&1
          unset PRODIGI_KEY
          rm -f /tmp/prodigi-key.txt /tmp/bto-secret-put.log
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
          node --check src/index.js
          node --check public/app.js
          npx wrangler deploy --dry-run --config wrangler.jsonc
          npx wrangler deploy --config wrangler.jsonc

      - name: Verify live automatic ordering and production assets
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          config=''
          for attempt in $(seq 1 30); do
            config=$(curl -fsS --max-time 20 "https://builttooffend.com/api/config?cb=$(date +%s%N)" || true)
            if CONFIG_JSON="$config" node -e 'const c=JSON.parse(process.env.CONFIG_JSON||"{}");process.exit(c.checkoutReady===true&&c.printer==="prodigi"?0:1)' 2>/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo "$config"
          health=$(curl -fsS --max-time 20 "https://builttooffend.com/api/health?cb=$(date +%s%N)")
          echo "$health" | grep -q '"ok":true'
          curl -fsS "https://builttooffend.com/app.js?cb=$(date +%s%N)" | grep -q 'W=6118,H=2161'
          curl -fsS https://builttooffend.com/robots.txt | grep -q 'Sitemap: https://builttooffend.com/sitemap.xml'
          curl -fsS https://builttooffend.com/sitemap.xml | grep -q 'novelty-cards.html'
          echo 'READY: Built To Offend -> Stripe -> direct Prodigi automatic print and dispatch.'

      - name: Close temporary authorization issues
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_ISSUE: ${{ steps.prodigi_handoff.outputs.issue_number }}
          CF_ISSUE: ${{ steps.cloudflare_auth.outputs.issue_number }}
        run: |
          set +e
          if [ -n "${HANDOFF_ISSUE:-}" ]; then gh issue close "$HANDOFF_ISSUE" --comment "Encrypted handoff window closed." >/dev/null 2>&1; fi
          if [ -n "${CF_ISSUE:-}" ]; then gh issue close "$CF_ISSUE" --comment "Cloudflare deployment authorization window closed." >/dev/null 2>&1; fi
          exit 0
