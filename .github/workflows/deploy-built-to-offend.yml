name: Deploy Built To Offend to Cloudflare

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - "built-to-offend/**"
      - ".github/workflows/deploy-built-to-offend.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 \
            | base64 -d > .deploy/built-to-offend.tar.xz
          tar -xJf .deploy/built-to-offend.tar.xz -C .deploy
          test -f .deploy/built-to-offend-production/wrangler.jsonc
          test -f .deploy/built-to-offend-production/src/index.js
          test -f .deploy/built-to-offend-production/public/index.html

      - name: Install dependencies
        working-directory: .deploy/built-to-offend-production
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript and Worker bundle
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check public/app.js
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Authenticate to Cloudflare
        working-directory: .deploy/built-to-offend-production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Using an existing GitHub Actions Cloudflare token."
            npx wrangler whoami
            exit 0
          fi

          echo "No stored deployment token; starting Cloudflare secure device authorization."
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          rm -f /tmp/cloudflare-device-login.log

          set +e
          (stdbuf -oL -eL npx wrangler login --device --browser=false 2>&1 | tee /tmp/cloudflare-device-login.log) &
          login_pid=$!
          set -e

          posted=0
          for attempt in $(seq 1 150); do
            code=$(grep -Eo '[A-Z0-9]{4}-[A-Z0-9]{4}' /tmp/cloudflare-device-login.log 2>/dev/null | head -1 || true)
            url=$(grep -Eo 'https://dash\.cloudflare\.com/oauth2/device[^[:space:]]*' /tmp/cloudflare-device-login.log 2>/dev/null | head -1 || true)
            if [ -n "$code" ] && [ "$posted" = 0 ]; then
              if [ -z "$url" ]; then
                url="https://dash.cloudflare.com/oauth2/device?user_code=$code"
              fi
              body=$(printf 'Built To Offend deployment is waiting for Cloudflare approval.\n\nOpen: %s\n\nOne-time code: **%s**\n\nApprove the request in the Cloudflare account that owns builttooffend.com and builttooffend.co.uk. The code expires quickly.\n\nDeployment run: %s' "$url" "$code" "$RUN_URL")
              gh issue create \
                --title "Cloudflare approval required — Built To Offend" \
                --body "$body" || true
              echo "::notice title=Cloudflare approval required::Open $url and approve code $code"
              posted=1
            fi
            if ! kill -0 "$login_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          set +e
          wait "$login_pid"
          rc=$?
          set -e
          cat /tmp/cloudflare-device-login.log || true
          if [ "$rc" -ne 0 ]; then
            echo "Cloudflare device authorization did not complete successfully."
            exit "$rc"
          fi
          npx wrangler whoami

      - name: Deploy new Worker and auto-provision D1/R2
        working-directory: .deploy/built-to-offend-production
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Apply D1 order migration
        working-directory: .deploy/built-to-offend-production
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Verify main site and redirects
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            echo "Health check attempt $attempt"
            body=$(curl -fsS --max-time 20 https://builttooffend.com/api/health || true)
            echo "$body"
            if echo "$body" | grep -q '"ok":true'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          curl -fsSI https://www.builttooffend.com/ | head -20
          curl -fsSI https://builttooffend.co.uk/ | head -20
          curl -fsSI https://www.builttooffend.co.uk/ | head -20
