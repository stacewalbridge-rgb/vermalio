name: Deploy Built To Offend to Cloudflare

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - "built-to-offend/**"
      - ".github/workflows/deploy-built-to-offend.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 \
            | base64 -d > .deploy/built-to-offend.tar.xz
          tar -xJf .deploy/built-to-offend.tar.xz -C .deploy
          test -f .deploy/built-to-offend-production/wrangler.jsonc
          test -f .deploy/built-to-offend-production/src/index.js
          test -f .deploy/built-to-offend-production/public/index.html

      - name: Make R2 optional for initial launch
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          let s = fs.readFileSync(path, 'utf8');
          s = s.replace(/,\s*"r2_buckets"\s*:\s*\[[\s\S]*?\](?=\s*})/m, '');
          s = s.replace(/"r2_buckets"\s*:\s*\[[\s\S]*?\]\s*,/m, '');
          const active = s.split('\n').filter(line => !line.trim().startsWith('//')).join('\n');
          if (active.includes('"r2_buckets"')) throw new Error('Active R2 binding is still present');
          fs.writeFileSync(path, s);
          NODE

      - name: Install dependencies
        working-directory: .deploy/built-to-offend-production
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript and Worker bundle
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check public/app.js
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Authenticate to Cloudflare
        working-directory: .deploy/built-to-offend-production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Using an existing GitHub Actions Cloudflare token."
            npx wrangler whoami
            exit 0
          fi

          echo "No stored deployment token; starting Cloudflare secure device authorization."
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          export NO_COLOR=1 FORCE_COLOR=0
          rm -f /tmp/cloudflare-device-login.log

          set +e
          (npx wrangler login --device --browser=false > /tmp/cloudflare-device-login.log 2>&1) &
          login_pid=$!
          set -e

          sleep 8
          printf '\nDeployment run: %s\n\n' "$RUN_URL" >> /tmp/cloudflare-device-login.log
          gh issue create \
            --title "Cloudflare approval required — Built To Offend — run ${{ github.run_number }}" \
            --body-file /tmp/cloudflare-device-login.log || true

          set +e
          wait "$login_pid"
          rc=$?
          set -e
          cat /tmp/cloudflare-device-login.log || true
          if [ "$rc" -ne 0 ]; then
            echo "Cloudflare device authorization did not complete successfully."
            exit "$rc"
          fi
          npx wrangler whoami

      - name: Bind existing D1 database
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          export NO_COLOR=1 FORCE_COLOR=0
          npx wrangler d1 list --json > /tmp/d1-list.json
          node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const db = list.find(x => x.name === 'built-to-offend-db');
          if (!db) throw new Error('Existing D1 database built-to-offend-db was not found');
          const id = db.uuid || db.id || db.database_id;
          if (!id) throw new Error('D1 database ID was not present in wrangler d1 list output');
          const path = 'wrangler.jsonc';
          let s = fs.readFileSync(path, 'utf8');
          const replacement = `"d1_databases": [\n    { "binding": "DB", "database_name": "built-to-offend-db", "database_id": "${id}" }\n  ]`;
          if (!/"d1_databases"\s*:\s*\[[\s\S]*?\]/m.test(s)) throw new Error('D1 binding block not found in wrangler config');
          s = s.replace(/"d1_databases"\s*:\s*\[[\s\S]*?\]/m, replacement);
          fs.writeFileSync(path, s);
          console.log(`Bound existing D1 database built-to-offend-db (${id})`);
          NODE
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy new Worker and D1
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy --config wrangler.jsonc

      - name: Apply D1 order migration
        working-directory: .deploy/built-to-offend-production
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Verify main site and redirects
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            echo "Health check attempt $attempt"
            body=$(curl -fsS --max-time 20 https://builttooffend.com/api/health || true)
            echo "$body"
            if echo "$body" | grep -q '"ok":true'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          curl -fsSI https://www.builttooffend.com/ | head -20
          curl -fsSI https://builttooffend.co.uk/ | head -20
          curl -fsSI https://www.builttooffend.co.uk/ | head -20
