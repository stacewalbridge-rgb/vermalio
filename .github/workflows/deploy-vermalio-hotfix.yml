name: Deploy Vermalio Hotfix

on:
  push:
    branches: [bto-prodigi-final-fix]
    paths:
      - ".github/workflows/deploy-vermalio-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy current main Vermalio Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          rm -rf /tmp/vermalio-main
          git fetch --depth=1 origin main:refs/remotes/origin/main
          git worktree add --detach /tmp/vermalio-main origin/main
          cd /tmp/vermalio-main
          npm install --no-audit --no-fund
          node --check src/worker.js
          node --check src/bto-prodigi-spread-bridge.js
          npx wrangler whoami
          npx wrangler deploy --dry-run --config wrangler.jsonc
          npx wrangler deploy --config wrangler.jsonc
      - name: Trigger paid-order retries and verify Prodigi order exists
        shell: bash
        run: |
          set -euo pipefail
          latest='cs_live_b1rgDhu7xOdgT9iua3ByL6javML7mWpgc1Im5DFWGkGVGoIYheCiYgmAHb'
          previous='cs_live_b1zrLDcYL5SfGlCc05WHqarTJtYV7b8U70LdwD9zKsaQ2q6Hjui4PKlslS'
          for i in $(seq 1 24); do
            a=$(curl -sS --max-time 30 "https://builttooffend.com/api/order-status?session_id=$latest" || true)
            b=$(curl -sS --max-time 30 "https://builttooffend.com/api/order-status?session_id=$previous" || true)
            p=$(curl -sS --max-time 30 'https://vermalio.stace-walbridge.workers.dev/api/prodigi/provider-stats' || true)
            echo "$a"
            echo "$b"
            echo "$p"
            if A="$a" P="$p" node -e 'const a=JSON.parse(process.env.A||"{}"); const p=JSON.parse(process.env.P||"{}"); process.exit(a.printerOrderId&&a.status==="submitted"&&Number(p.orderCount)>0?0:1)' 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
