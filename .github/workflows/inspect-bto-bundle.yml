name: Inspect Built To Offend bundle

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - ".github/workflows/inspect-bto-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build patched production source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .inspect
          mkdir -p .inspect
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 \
            | base64 -d > .inspect/built-to-offend.tar.xz
          tar -xJf .inspect/built-to-offend.tar.xz -C .inspect
          cd .inspect/built-to-offend-production
          cp "$GITHUB_WORKSPACE/built-to-offend/deploy/0002_secure_tokens.sql" migrations/0002_secure_tokens.sql
          patch -p0 --forward < "$GITHUB_WORKSPACE/built-to-offend/deploy/bto-source.patch"
          node "$GITHUB_WORKSPACE/.github/bto-seo-build.js"
          node "$GITHUB_WORKSPACE/.github/bto-runtime-fix.js"
          node --check src/index.js
          node --check public/app.js
          node --check "$GITHUB_WORKSPACE/built-to-offend/deploy/vermalio-prodigi-proxy.js"
          grep -q "built-to-offend-basket-v1" public/app.js
          grep -q "addToBasket(article,v,d,select)" public/app.js
          grep -q "renderProdigiSheetBlob" public/app.js
          grep -q "image/jpeg" public/app.js
          grep -q "request.method === \"OPTIONS\"" src/index.js
          grep -q "API_CORS_HEADERS" src/index.js
          grep -q "single-sheet" "$GITHUB_WORKSPACE/built-to-offend/deploy/vermalio-prodigi-proxy.js"
          grep -q "defaultArea" "$GITHUB_WORKSPACE/built-to-offend/deploy/vermalio-prodigi-proxy.js"
          echo 'BTO basket, print-sheet and API patched source validates successfully.'
      - name: Show patched checkout path
        shell: bash
        run: |
          set -euo pipefail
          cd .inspect/built-to-offend-production
          grep -n -E 'BASKET_KEY|addToBasket|renderProdigiSheetBlob|printSheet|miniCart|API_CORS_HEADERS|redirectHostIfNeeded' public/app.js src/index.js | head -160
