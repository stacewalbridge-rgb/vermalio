name: Inspect Built To Offend bundle

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - ".github/workflows/inspect-bto-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .inspect
          mkdir -p .inspect
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 \
            | base64 -d > .inspect/built-to-offend.tar.xz
          tar -xJf .inspect/built-to-offend.tar.xz -C .inspect
      - name: Probe live basket and frontend
        shell: bash
        run: |
          set +e
          echo '===== LIVE CONFIG ====='
          curl -sS --max-time 20 -D - https://builttooffend.com/api/config
          echo
          echo '===== LIVE /api/orders PREFLIGHT ====='
          curl -sS --max-time 20 -D - -o /dev/null -X OPTIONS \
            -H 'Origin: https://builttooffend.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            https://builttooffend.com/api/orders
          echo
          echo '===== LIVE /api/orders POST ====='
          curl -sS --max-time 30 -D - -X POST \
            -H 'Origin: https://builttooffend.com' \
            -H 'Content-Type: application/json' \
            --data '{"recipient":"BTO-SMOKE-TEST","occasion":"Birthday","brutality":5,"label":"SMOKE TEST","front":"BTO API SMOKE TEST","inside":"This is an automated Built To Offend API smoke test draft. It must never be fulfilled.","art":"monster"}' \
            https://builttooffend.com/api/orders
          echo
          echo '===== LIVE INDEX SCRIPT REFERENCES ====='
          curl -fsS --max-time 20 https://builttooffend.com/ | grep -n -E 'app\\.js|cart|basket|ORDER THIS ONE' | head -100 || true
          echo
          echo '===== LIVE APP.JS ====='
          curl -fsS --max-time 20 https://builttooffend.com/app.js || true
      - name: Check public domains
        shell: bash
        run: |
          set +e
          for host in builttooffend.com www.builttooffend.com builttooffend.co.uk www.builttooffend.co.uk; do
            echo "===== $host ====="
            curl -sSIL --max-time 20 "https://$host/" | head -20
            curl -sS --max-time 20 -D - "https://$host/api/health" | head -30
          done
          exit 0
