name: Inspect Built To Offend bundle

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - ".github/workflows/inspect-bto-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .inspect
          mkdir -p .inspect
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 \
            | base64 -d > .inspect/built-to-offend.tar.xz
          tar -xJf .inspect/built-to-offend.tar.xz -C .inspect
      - name: Probe complete order preparation path
        shell: bash
        run: |
          set -euo pipefail
          echo '===== CONFIG ====='
          curl -fsS https://builttooffend.com/api/config
          echo

          order_json=$(curl -fsS --max-time 30 -X POST \
            -H 'Origin: https://builttooffend.com' \
            -H 'Content-Type: application/json' \
            --data '{"recipient":"BTO-ASSET-SMOKE","occasion":"Birthday","brutality":5,"label":"SMOKE TEST","front":"BTO ASSET SMOKE TEST","inside":"Automated draft used only to verify that print artwork uploads work. It must never be fulfilled.","art":"monster"}' \
            https://builttooffend.com/api/orders)
          echo "$order_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s); console.log(JSON.stringify({ok:!!j.orderId,pricing:j.pricing}))})"
          order_id=$(printf '%s' "$order_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).orderId||''))")
          token=$(printf '%s' "$order_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).uploadToken||''))")
          test -n "$order_id"
          test -n "$token"

          # Valid 1x1 PNG, sufficient to verify the Worker/KV upload endpoint.
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z3ioAAAAASUVORK5CYII=' | base64 -d >/tmp/smoke.png

          echo '===== OUTSIDE UPLOAD ====='
          curl -fsS --max-time 30 -D /tmp/outside.headers -o /tmp/outside.body -X PUT \
            -H 'Origin: https://builttooffend.com' \
            -H 'Content-Type: image/png' \
            -H "x-order-token: $token" \
            --data-binary @/tmp/smoke.png \
            "https://builttooffend.com/api/order-asset?order_id=$order_id&kind=outside"
          cat /tmp/outside.headers
          cat /tmp/outside.body
          echo

          echo '===== INSIDE UPLOAD ====='
          curl -fsS --max-time 30 -D /tmp/inside.headers -o /tmp/inside.body -X PUT \
            -H 'Origin: https://builttooffend.com' \
            -H 'Content-Type: image/png' \
            -H "x-order-token: $token" \
            --data-binary @/tmp/smoke.png \
            "https://builttooffend.com/api/order-asset?order_id=$order_id&kind=inside"
          cat /tmp/inside.headers
          cat /tmp/inside.body
          echo

          echo '===== CHECKOUT EXPECTED RESPONSE ====='
          curl -sS --max-time 30 -D /tmp/checkout.headers -o /tmp/checkout.body -X POST \
            -H 'Origin: https://builttooffend.com' \
            -H 'Content-Type: application/json' \
            --data "{\"orderId\":\"$order_id\",\"uploadToken\":\"$token\"}" \
            https://builttooffend.com/api/checkout
          cat /tmp/checkout.headers
          cat /tmp/checkout.body
          echo

          echo '===== FULFILMENT SECTION ====='
          curl -fsS https://builttooffend.com/ | sed -n '/id="fulfilment"/,/<\/section>/p' | head -250 || true
