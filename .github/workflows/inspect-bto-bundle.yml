name: Inspect Built To Offend bundle

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - ".github/workflows/inspect-bto-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .inspect
          mkdir -p .inspect
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 \
            | base64 -d > .inspect/built-to-offend.tar.xz
          tar -xJf .inspect/built-to-offend.tar.xz -C .inspect
      - name: Inspect basket and API code
        shell: bash
        run: |
          set -euo pipefail
          cd .inspect/built-to-offend-production
          echo '===== FILES ====='
          find public src -maxdepth 2 -type f -print | sort
          echo '===== APP.JS BASKET/FETCH MATCHES ====='
          grep -n -E 'api/orders|api/order-asset|api/checkout|basket|ORDER THIS ONE|fetch\\(' public/app.js || true
          echo '===== INDEX.JS API MATCHES ====='
          grep -n -E 'api/orders|redirectHostIfNeeded|ASSETS|fetch\\(' src/index.js || true
          echo '===== APP.JS ====='
          cat public/app.js
      - name: Check public domains
        shell: bash
        run: |
          set +e
          report=.inspect/domain-check.txt
          : > "$report"
          for host in builttooffend.com www.builttooffend.com builttooffend.co.uk www.builttooffend.co.uk; do
            echo "===== $host =====" >> "$report"
            getent ahosts "$host" >> "$report" 2>&1
            echo "--- HEAD ---" >> "$report"
            curl -sSIL --max-time 20 "https://$host/" >> "$report" 2>&1
            echo "--- HEALTH ---" >> "$report"
            curl -sS --max-time 20 -D - "https://$host/api/health" >> "$report" 2>&1
            echo >> "$report"
          done
          cat "$report"
          exit 0
      - name: Upload unpacked production source and domain check
        uses: actions/upload-artifact@v4
        with:
          name: built-to-offend-inspection
          path: |
            .inspect/built-to-offend-production
            .inspect/domain-check.txt
          retention-days: 1
