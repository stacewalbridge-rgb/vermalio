name: Inspect BTO paid order status path

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - ".github/workflows/inspect-bto-paid-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query live paid order status
        shell: bash
        run: |
          set -euo pipefail
          url='https://builttooffend.com/api/order-status?session_id=cs_live_b1zrLDcYL5SfGlCc05WHqarTJtYV7b8U70LdwD9zKsaQ2q6Hjui4PKlslS'
          for n in 1 2 3; do
            echo "=== STATUS CHECK $n ==="
            code=$(curl -sS --max-time 20 -o /tmp/status.json -w '%{http_code}' "$url")
            echo "HTTP $code: $(cat /tmp/status.json)"
            test "$code" = 200
            sleep 3
          done
