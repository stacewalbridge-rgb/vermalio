name: Judge AI Android APK

on:
  push:
    branches: [judge-ai]
    paths:
      - "android-judge/**"
      - ".github/workflows/judge-ai-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Prepare stable test signing key
        run: base64 -d test-signing/judgeai-test.keystore.b64 > judgeai-test.keystore
        working-directory: android-judge
      - run: gradle :app:assembleDebug
        working-directory: android-judge
      - uses: actions/upload-artifact@v4
        with:
          name: JudgeAI-debug-apk
          path: android-judge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
