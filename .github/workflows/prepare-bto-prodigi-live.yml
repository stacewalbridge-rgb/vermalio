name: Prepare Built To Offend Prodigi Live

on:
  push:
    branches: [built-to-offend-prodigi-ready]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
      BTO_DIR: ${{ github.workspace }}/.deploy/built-to-offend-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild production shop without deploying
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cat built-to-offend/chunk-00.b64 built-to-offend/chunk-01.b64 built-to-offend/chunk-02.b64 \
            | base64 -d > .deploy/built-to-offend.tar.xz
          tar -xJf .deploy/built-to-offend.tar.xz -C .deploy
          test -f "$BTO_DIR/src/index.js"
          test -f "$BTO_DIR/public/app.js"
          test -f "$BTO_DIR/wrangler.jsonc"
          cp built-to-offend/deploy/0002_secure_tokens.sql "$BTO_DIR/migrations/0002_secure_tokens.sql"
          cd "$BTO_DIR"
          patch -p0 --forward < "$GITHUB_WORKSPACE/built-to-offend/deploy/bto-source.patch"
          npm install --no-audit --no-fund
          node --check src/index.js
          node --check public/app.js
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Validate hardened Prodigi order bridge
        shell: bash
        run: |
          set -euo pipefail
          cp built-to-offend/deploy/vermalio-prodigi-proxy.js /tmp/bto-prodigi-proxy.js
          sed -i 's/__BTO_PROXY_TOKEN_HASH__/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/' /tmp/bto-prodigi-proxy.js
          node --check /tmp/bto-prodigi-proxy.js
          grep -q 'https://api.prodigi.com' /tmp/bto-prodigi-proxy.js
          grep -q 'https://api.sandbox.prodigi.com' /tmp/bto-prodigi-proxy.js
          grep -q '/v4.0/products/' /tmp/bto-prodigi-proxy.js
          grep -q 'idempotencyKey' /tmp/bto-prodigi-proxy.js
          grep -q 'createdwithissues' /tmp/bto-prodigi-proxy.js || true
          grep -q 'Configured greeting-card SKU does not expose distinct outside and inside print areas' /tmp/bto-prodigi-proxy.js
          grep -q 'Prodigi .* order rejected' /tmp/bto-prodigi-proxy.js
          grep -q 'Built To Offend is currently accepting UK delivery only' /tmp/bto-prodigi-proxy.js

      - name: Prove Vermalio bridge injection compiles
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin built-to-offend-prodigi-webhook:refs/remotes/origin/built-to-offend-prodigi-webhook
          rm -rf /tmp/vermalio-ready
          git worktree add --detach /tmp/vermalio-ready origin/built-to-offend-prodigi-webhook
          cp built-to-offend/deploy/vermalio-prodigi-proxy.js /tmp/vermalio-ready/src/bto-prodigi-proxy.js
          node <<'NODE'
          const fs = require('fs');
          const modulePath = '/tmp/vermalio-ready/src/bto-prodigi-proxy.js';
          let mod = fs.readFileSync(modulePath, 'utf8');
          mod = mod.replace('__BTO_PROXY_TOKEN_HASH__', 'a'.repeat(64));
          if (mod.includes('__BTO_PROXY_TOKEN_HASH__')) throw new Error('Proxy token hash placeholder remains');
          fs.writeFileSync(modulePath, mod);
          const indexPath = '/tmp/vermalio-ready/src/index.js';
          let source = fs.readFileSync(indexPath, 'utf8');
          const importLine = 'import { handleBtoProdigiProxy } from "./bto-prodigi-proxy.js";\n';
          if (!source.includes(importLine.trim())) source = importLine + source;
          const exportPos = source.indexOf('export default {');
          const marker = '    const url = new URL(request.url);\n';
          const markerPos = source.indexOf(marker, exportPos);
          if (exportPos < 0 || markerPos < 0) throw new Error('Vermalio Worker route marker not found');
          const route = '    if (url.pathname.startsWith("/api/internal/bto/prodigi")) {\n      return handleBtoProdigiProxy(request, env, url);\n    }\n\n';
          if (!source.includes(route)) {
            const insertAt = markerPos + marker.length;
            source = source.slice(0, insertAt) + route + source.slice(insertAt);
          }
          fs.writeFileSync(indexPath, source);
          NODE
          cd /tmp/vermalio-ready
          npm install --no-audit --no-fund
          node --check src/index.js
          node --check src/bto-prodigi-proxy.js
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Validate final activation safeguards
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/deploy-built-to-offend.yml
          grep -q "PRINT_PROVIDER: 'hold'" "$workflow"
          grep -q "has_prodigi=true" "$workflow"
          grep -q "PRODIGI_PROXY_URL" "$workflow"
          grep -q "cfg.vars.PRINT_PROVIDER = 'prodigi'" "$workflow"
          grep -q "cfg.vars.PRODIGI_ENV = 'live'" "$workflow"
          grep -q 'Live Prodigi validation passed; automatic fulfilment enabled.' "$workflow"
          grep -q 'checkout remains safely closed' "$workflow"
          echo 'READY_FOR_LIVE_KEY: static and dry-run gates passed; no Cloudflare deployment performed.'
