name: Verify Built To Offend Live

on:
  push:
    branches: [built-to-offend-deploy]
    paths:
      - ".github/workflows/verify-bto-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Full current live verification
        shell: bash
        run: |
          set -euo pipefail
          base=https://builttooffend.com

          echo '== DOMAIN HEALTH =='
          for host in builttooffend.com www.builttooffend.com builttooffend.co.uk www.builttooffend.co.uk; do
            code=$(curl -LsS --max-time 20 -o /tmp/health.json -w '%{http_code}' "https://$host/api/health?verify=$(date +%s)")
            echo "$host final HTTP $code: $(cat /tmp/health.json)"
            test "$code" = 200
            node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));if(j.ok!==true)process.exit(1)'
          done

          echo '== CONFIG =='
          config=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$base/api/config?verify=$(date +%s)")
          echo "$config"
          CONFIG="$config" node -e 'const c=JSON.parse(process.env.CONFIG||"{}");if(c.checkoutReady!==true||c.printer!=="prodigi"||c.worldwideReady!==true||c.cardPricePence!==499||c.photoAddOnPence!==100||c.ukShippingPence!==199)process.exit(1)'

          echo '== AI GENERATION =='
          generated=$(curl -fsS --max-time 60 -X POST -H 'content-type: application/json' --data '{"recipient":"Acceptance Test","occasion":"Birthday","relationship":"Friend","tone":"playful","ammo":"always late","quote":"","avoid":"","brutality":4,"art":"monster"}' "$base/api/generate")
          echo "$generated"
          GENERATED="$generated" node -e 'const j=JSON.parse(process.env.GENERATED||"{}");if(!Array.isArray(j.versions)||j.versions.length<3||j.versions.slice(0,3).some(v=>!v.front||!v.inside))process.exit(1)'

          echo '== ORDER + SECURITY =='
          order_code=$(curl -sS --max-time 30 -o /tmp/order.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"recipient":"Acceptance Test","occasion":"Birthday","brutality":4,"label":"THE SAVAGE","front":"Happy Birthday, Test!","inside":"Happy birthday! Hope you have a brilliant day.","art":"monster"}' "$base/api/orders")
          order=$(cat /tmp/order.json)
          echo "order HTTP $order_code: $order"
          test "$order_code" = 200
          order_id=$(ORDER="$order" node -e 'const j=JSON.parse(process.env.ORDER);process.stdout.write(j.orderId||"")')
          token=$(ORDER="$order" node -e 'const j=JSON.parse(process.env.ORDER);process.stdout.write(j.uploadToken||"")')
          test -n "$order_id"; test -n "$token"
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z3ioAAAAASUVORK5CYII=' | base64 -d >/tmp/a.png
          bad=$(curl -sS --max-time 20 -o /tmp/bad.json -w '%{http_code}' -X PUT -H 'content-type: image/png' -H 'x-order-token: wrong-token' --data-binary @/tmp/a.png "$base/api/order-asset?order_id=$order_id&kind=outside")
          echo "wrong-token upload HTTP $bad: $(cat /tmp/bad.json)"
          test "$bad" = 401 -o "$bad" = 403
          for kind in outside inside; do
            code=$(curl -sS --max-time 30 -o /tmp/upload.json -w '%{http_code}' -X PUT -H 'content-type: image/png' -H "x-order-token: $token" --data-binary @/tmp/a.png "$base/api/order-asset?order_id=$order_id&kind=$kind")
            echo "$kind upload HTTP $code: $(cat /tmp/upload.json)"
            test "$code" = 200
          done

          echo '== CHECKOUT HANDOFF =='
          code=$(curl -sS --max-time 30 -o /tmp/checkout.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data "{\"orderId\":\"$order_id\",\"uploadToken\":\"$token\"}" "$base/api/checkout")
          echo "checkout HTTP $code: $(cat /tmp/checkout.json)"
          test "$code" = 200
          ORDER_ID="$order_id" node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/checkout.json","utf8"));const u=new URL(j.checkoutUrl);if(u.hostname!=="buy.stripe.com"||u.searchParams.get("client_reference_id")!==process.env.ORDER_ID)process.exit(1)'

          echo '== PRODIGI WEBHOOK RECEIVER =='
          code=$(curl -sS --max-time 20 -o /tmp/pw.json -w '%{http_code}' https://vermalio.stace-walbridge.workers.dev/api/prodigi/webhook/health)
          echo "Prodigi webhook HTTP $code: $(cat /tmp/pw.json)"
          test "$code" = 200
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/pw.json","utf8"));if(j.ok!==true)process.exit(1)'

          echo 'READY: Built To Offend AI + Stripe + Prodigi live verification passed.'
