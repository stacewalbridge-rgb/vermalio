name: WhyDrive Cloudflare domain setup

# Connects whydrive.co.uk / www.whydrive.co.uk to the Pages project "whydrive".
# Safe by design: lists the zone, only CREATES missing website records (never edits or deletes
# DNS records), and re-registers the Pages custom domains so Cloudflare re-validates them.

on:
  push:
    branches: [claude/whydrive-website-build-cm2orl]
    paths: [".github/workflows/whydrive-cloudflare-setup.yml", "whydrive-site/SETUP_RUN"]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || secrets.WHYDRIVE_RESEND_API_KEY }}
      ZONE_NAME: whydrive.co.uk
      PROJECT: whydrive
    steps:
      - name: Resend key and domain check (sends only to Resend's test inbox)
        shell: bash
        run: |
          set -uo pipefail
          r() { curl -sS --max-time 30 -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" "$@"; }
          echo "domains:"; r https://api.resend.com/domains | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.data){console.log(JSON.stringify(j).slice(0,300));return};for(const d of j.data)console.log(' ',d.name,d.status,d.region,JSON.stringify(d.capabilities||{}),d.id)})"
          ID=$(r https://api.resend.com/domains | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const d=(j.data||[]).find(x=>x.name==='whydrive.co.uk');process.stdout.write(d?d.id:'')})")
          if [ -n "$ID" ]; then r "https://api.resend.com/domains/$ID" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('status',j.status);for(const x of (j.records||[]))console.log(' ',x.record,x.type,x.name,x.status,String(x.value).slice(0,60),x.priority||'')})"; fi
          echo "test send to delivered@resend.dev:"
          r -X POST https://api.resend.com/emails --data '{"from":"WhyDrive <driver@whydrive.co.uk>","to":["delivered@resend.dev"],"subject":"WhyDrive sending test","text":"Sending test from driver@whydrive.co.uk"}' | head -c 300; echo

      - name: Probe token permissions (read only)
        shell: bash
        run: |
          set -uo pipefail
          api() { curl -sS --max-time 30 -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          j() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);$1})"; }
          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" | j "process.stdout.write((j.result&&j.result[0]&&j.result[0].id)||'')")
          echo "account token verify:"; api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify" | j "console.log(j.success, j.result&&j.result.status, JSON.stringify(j.errors))"
          echo "zone workers routes read:"; api "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" | j "console.log(j.success, JSON.stringify(j.errors), (j.result||[]).length)"
          echo "account workers domains read:"; api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/domains" | j "console.log(j.success, JSON.stringify(j.errors), (j.result||[]).map(d=>d.hostname+'->'+d.service).join(', '))"
          echo "workers scripts read:"; api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" | j "console.log(j.success, JSON.stringify(j.errors), (j.result||[]).map(s=>s.id).join(', '))"
          echo "zone settings read:"; api "https://api.cloudflare.com/client/v4/zones/$ZONE/settings/ssl" | j "console.log(j.success, JSON.stringify(j.errors))"
          echo "zone page rules/rulesets read:"; api "https://api.cloudflare.com/client/v4/zones/$ZONE/rulesets" | j "console.log(j.success, JSON.stringify(j.errors))"
          echo "dns records read:"; api "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?per_page=100" | j "console.log(j.success, JSON.stringify(j.errors)); for(const r of (j.result||[]))console.log('   ',r.type,r.name,String(r.content).slice(0,60))"
          echo "email routing settings read:"; api "https://api.cloudflare.com/client/v4/zones/$ZONE/email/routing" | j "console.log(j.success, JSON.stringify(j.errors), j.result&&j.result.enabled)"
          echo "resend key in repo secrets: $([ -n \"${RESEND_API_KEY:-}\" ] && echo yes || echo no)"
          echo "email routing addresses read:"; api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/email/routing/addresses" | j "console.log(j.success, JSON.stringify(j.errors))"
