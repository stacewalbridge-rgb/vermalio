name: Deploy WhyDrive website to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/whydrive-launch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      PROJECT_NAME: whydrive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch approved WhyDrive light website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .whydrive-source
          git clone --depth 1 --branch whydrive-website https://github.com/stacewalbridge-rgb/robs-travel-taxis.git .whydrive-source
          test -f .whydrive-source/whydrive-site/index.html
          test -f .whydrive-source/whydrive-site/assets/whydrive-logo-light.jpg
          grep -q 'assets/whydrive-logo-light.jpg' .whydrive-source/whydrive-site/index.html
          grep -q 'AI-powered. Locally driven.' .whydrive-source/whydrive-site/index.html

      - name: Authenticate Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@4 whoami

      - name: Ensure WhyDrive Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4 pages project list | grep -q "${PROJECT_NAME}"; then
            npx --yes wrangler@4 pages project create "${PROJECT_NAME}" --production-branch=main
          fi

      - name: Deploy WhyDrive website
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy .whydrive-source/whydrive-site \
            --project-name="${PROJECT_NAME}" \
            --branch=main \
            --commit-dirty=true | tee /tmp/whydrive-deploy.txt
          grep -Eo 'https://[^ ]+\.pages\.dev' /tmp/whydrive-deploy.txt | tail -1 | tee /tmp/whydrive-url.txt || true

      - name: Attach whydrive.co.uk custom domains
        shell: bash
        run: |
          set -euo pipefail
          for domain in whydrive.co.uk www.whydrive.co.uk; do
            echo "Attaching $domain"
            curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${domain}\"}" | tee "/tmp/${domain}.json"
            echo
          done

      - name: Report deployment
        shell: bash
        run: |
          set -euo pipefail
          echo "WhyDrive Pages project: https://${PROJECT_NAME}.pages.dev"
          echo "Target domains: https://whydrive.co.uk and https://www.whydrive.co.uk"
          echo "Custom domain status:"
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true
