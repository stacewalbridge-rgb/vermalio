name: WhyDrive redirect rules

# Cloudflare redirect rules on whydrive.co.uk run before the website Worker. This workflow
# lists them (read only). whydrive-site/REDIRECT_RULES_APPLY switches on the one change below.

on:
  push:
    branches: [claude/whydrive-website-build-cm2orl]
    paths: [".github/workflows/whydrive-redirect-rules.yml", "whydrive-site/REDIRECT_RULES_APPLY"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      ZONE_NAME: whydrive.co.uk
    steps:
      - uses: actions/checkout@v4
      - name: List redirect rules (read only)
        shell: bash
        run: |
          set -uo pipefail
          api() { curl -sS --max-time 30 -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write((j.result&&j.result[0]&&j.result[0].id)||'')})")
          echo "zone found: $([ -n "$ZONE" ] && echo yes || echo no)"
          api "https://api.cloudflare.com/client/v4/zones/$ZONE/rulesets" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('rulesets ok',j.success,JSON.stringify(j.errors));for(const r of (j.result||[]))console.log(' ',r.phase,r.kind,r.name,r.id)})"
          for PHASE in http_request_dynamic_redirect http_request_transform http_request_origin; do
            echo "== $PHASE"
            api "https://api.cloudflare.com/client/v4/zones/$ZONE/rulesets/phases/$PHASE/entrypoint" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.log(' none/err',JSON.stringify(j.errors));return}for(const r of (j.result.rules||[]))console.log(JSON.stringify({id:r.id,enabled:r.enabled,description:r.description,expression:r.expression,action:r.action,action_parameters:r.action_parameters}))})"
          done
          echo "== page rules"
          api "https://api.cloudflare.com/client/v4/zones/$ZONE/pagerules" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.success,JSON.stringify(j.errors));for(const r of (j.result||[]))console.log(JSON.stringify({id:r.id,status:r.status,targets:r.targets,actions:r.actions}))})"
          echo "== bulk redirect lists (account)"
          ACC=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write((j.result&&j.result.account&&j.result.account.id)||'')})")
          api "https://api.cloudflare.com/client/v4/accounts/$ACC/rules/lists" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.success,JSON.stringify(j.errors));for(const r of (j.result||[]))console.log(JSON.stringify({id:r.id,name:r.name,kind:r.kind,items:r.num_items}))})"
