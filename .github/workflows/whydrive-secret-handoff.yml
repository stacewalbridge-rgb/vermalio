name: WhyDrive secret handoff

# One-time, encrypted hand-over of Worker secrets without storing them in the repo.
# 1. Generates an RSA key pair on the runner and commits ONLY the public key.
# 2. Waits for whydrive-site/handoff/secrets.enc (encrypted to that public key) to be pushed.
# 3. Decrypts on the runner, stores each KEY=VALUE as a Worker/Pages secret, then deletes the handoff files.
# The private key never leaves the runner.

on:
  push:
    branches: [claude/whydrive-website-build-cm2orl]
    paths: [".github/workflows/whydrive-secret-handoff.yml", "whydrive-site/HANDOFF_REQUEST"]

permissions:
  contents: write

concurrency:
  group: whydrive-secret-handoff
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      BRANCH: claude/whydrive-website-build-cm2orl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/whydrive-website-build-cm2orl
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish one-time public key
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/handoff.key" 2>/dev/null
          mkdir -p whydrive-site/handoff
          openssl pkey -in "$RUNNER_TEMP/handoff.key" -pubout -out whydrive-site/handoff/pubkey.pem
          echo "${GITHUB_RUN_ID}" > whydrive-site/handoff/RUN_ID
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whydrive-site/handoff
          git commit -qm "Handoff: one-time public key for run ${GITHUB_RUN_ID}"
          git push -q origin "HEAD:${BRANCH}"
          echo "Public key published."
      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4 >/dev/null
      - name: Wait for encrypted secrets, then store them
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            git fetch -q origin "$BRANCH"
            if git cat-file -e "origin/${BRANCH}:whydrive-site/handoff/secrets.enc" 2>/dev/null; then break; fi
            sleep 10
          done
          git cat-file -e "origin/${BRANCH}:whydrive-site/handoff/secrets.enc" || { echo "No encrypted secrets arrived"; exit 1; }
          git show "origin/${BRANCH}:whydrive-site/handoff/secrets.enc" | base64 -d > "$RUNNER_TEMP/secrets.bin"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/handoff.key" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/secrets.bin" -out "$RUNNER_TEMP/secrets.env"
          while IFS='=' read -r KEY VAL; do
            [ -z "$KEY" ] && continue
            echo "::add-mask::$VAL"
            case "$KEY" in RESEND_API_KEY|ENQUIRY_TO) ;; *) echo "Skipping unexpected key"; continue;; esac
            printf '%s' "$VAL" | npx wrangler secret put "$KEY" --name whydrive-website >/dev/null && echo "Worker secret set: $KEY"
            printf '%s' "$VAL" | npx wrangler pages secret put "$KEY" --project-name whydrive >/dev/null && echo "Pages secret set: $KEY" || echo "Pages secret not set: $KEY"
          done < "$RUNNER_TEMP/secrets.env"
          shred -u "$RUNNER_TEMP/secrets.env" "$RUNNER_TEMP/secrets.bin" "$RUNNER_TEMP/handoff.key"
      - name: Remove handoff files
        if: always()
        run: |
          git fetch -q origin "$BRANCH" && git reset -q --hard "origin/${BRANCH}"
          if [ -d whydrive-site/handoff ]; then
            git rm -rq whydrive-site/handoff && git commit -qm "Handoff complete: remove one-time files" && git push -q origin "HEAD:${BRANCH}" && echo "Handoff files removed."
          fi
          sleep 15
          curl -sS --max-time 20 https://whydrive.co.uk/api/health || true
