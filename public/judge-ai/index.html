<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Judge AI</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#0b0d10;color:#f5f7fa}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{border-right:1px solid #242932;padding:20px;background:#11141a}.brand{font-size:25px;font-weight:800}.sub{color:#9aa4b2;margin-top:5px}.pill{display:inline-block;padding:6px 10px;border:1px solid #2c3440;border-radius:999px;margin:6px 6px 0 0;font-size:12px}.main{display:flex;flex-direction:column;min-width:0}.top{padding:18px 24px;border-bottom:1px solid #242932;display:flex;justify-content:space-between}.chat{flex:1;overflow:auto;padding:28px;max-width:1050px;width:100%;margin:auto}.msg{padding:16px 18px;border-radius:16px;margin:12px 0;white-space:pre-wrap;line-height:1.45}.user{background:#1d2430;margin-left:12%}.ai{background:#141820;border:1px solid #242932;margin-right:6%}.meta{font-size:12px;color:#8f9aaa;margin-bottom:8px}.composer{padding:18px;border-top:1px solid #242932;background:#0d1015}.box{max-width:1050px;margin:auto;display:flex;gap:10px}textarea{flex:1;min-height:64px;max-height:180px;resize:vertical;border:1px solid #303846;background:#151a22;color:#fff;border-radius:15px;padding:14px;font:inherit}button{border:0;border-radius:13px;padding:0 22px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.status{font-size:12px;color:#95a1b1}@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none}.chat{padding:16px}.user{margin-left:4%}.ai{margin-right:0}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Judge AI</div><div class="sub">Multi-model supervisor</div><div id="providers" style="margin-top:18px"></div><p class="status" style="margin-top:22px">One request. Multiple independent AIs. Judge reconciles the result.</p></aside><main class="main"><div class="top"><strong>Judge AI</strong><span id="state" class="status">Checking connections…</span></div><div id="chat" class="chat"><div class="msg ai"><div class="meta">Judge AI</div>Tell me what needs fixing. I’ll send it to the available specialist models, compare their findings and return one reconciled result.</div></div><div class="composer"><div class="box"><textarea id="input" placeholder="e.g. Fix the WhyDrive customer booking failure and verify the build…"></textarea><button id="send">Send</button></div></div></main></div>
<script>
const chat=document.getElementById("chat"), input=document.getElementById("input"), send=document.getElementById("send"), state=document.getElementById("state"), providers=document.getElementById("providers");
let access=sessionStorage.getItem("judge_ai_access")||"";
function authHeaders(extra={}){return {"authorization":"Bearer "+access,...extra}}
async function ensureAccess(){if(access)return true;access=prompt("Judge AI access key")||"";if(!access)return false;sessionStorage.setItem("judge_ai_access",access);return true}
function add(text,cls,meta){const d=document.createElement("div");d.className="msg "+cls;const m=document.createElement("div");m.className="meta";m.textContent=meta;d.appendChild(m);d.append(document.createTextNode(text));chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function status(){try{if(!await ensureAccess()){state.textContent="Access key required";return}const j=await fetch("/api/judge-ai/status",{headers:authHeaders()}).then(r=>r.json());providers.innerHTML="";Object.entries(j.configured||{}).forEach(([k,v])=>{const s=document.createElement("span");s.className="pill";s.textContent=(v?"✓ ":"○ ")+k;providers.appendChild(s)});const n=Object.entries(j.configured||{}).filter(([k,v])=>v&&["openai","anthropic","gemini","openrouter"].includes(k)).length;state.textContent=n+" AI provider"+(n===1?"":"s")+" connected"}catch{state.textContent="Connection check failed"}}
async function go(){const message=input.value.trim();if(!message)return;input.value="";add(message,"user","You");send.disabled=true;state.textContent="Judge AI is consulting the team…";try{if(!await ensureAccess())throw new Error("Access key required");const r=await fetch("/api/judge-ai/chat",{method:"POST",headers:authHeaders({"content-type":"application/json"}),body:JSON.stringify({message})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"Request failed");add(j.judge.text,"ai","Judge AI · "+j.judge.provider);state.textContent="Completed with "+j.reports.filter(x=>x.ok).length+" specialist report(s)"}catch(e){add("Error: "+e.message,"ai","Judge AI");state.textContent="Failed"}finally{send.disabled=false;input.focus()}}
send.onclick=go;input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go()}});status();
</script></body></html>
